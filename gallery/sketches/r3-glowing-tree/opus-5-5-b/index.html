<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glowing Tree</title>
<style>
  html, body { margin: 0; height: 100%; background: #02040c; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const TAU = Math.PI * 2;

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  const rand = Math.random;
  const lerp = (a, b, t) => a + (b - a) * t;

  function makeCanvas(w, h) {
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(w));
    c.height = Math.max(1, Math.round(h));
    return c;
  }

  // ---------- Tree structure (generated once, in abstract units) ----------
  const trng = mulberry32(4127);
  const UP = -Math.PI / 2;

  function node(a, len, w, d) {
    return { a, len, w, d, ph: trng() * TAU, kids: [], leaves: [] };
  }

  function addLeaves(n, k, spread) {
    for (let i = 0; i < k; i++) {
      const r = Math.sqrt(trng()) * spread;
      const t = trng() * TAU;
      n.leaves.push({
        ox: Math.cos(t) * r, oy: Math.sin(t) * r,
        s: 0.35 + trng() * 0.9,
        hue: trng(),
        ph: trng() * TAU,
        sp: 0.6 + trng() * 1.8
      });
    }
  }

  // Each branch is drawn as two slightly kinked segments, then forks.
  function branch(relA, absA, len, w, d) {
    const k1 = (trng() - 0.5) * 0.22;
    const a = node(relA, len * 0.5, w, d);
    const b = node(k1, len * 0.5, w * 0.9, d);
    a.kids.push(b);
    const abs = absA + relA + k1;
    if (len < 0.05 || d >= 9) {
      addLeaves(b, 3 + Math.floor(trng() * 4), 0.045);
      return a;
    }
    const tropism = (UP - abs) * 0.06;
    const three = d > 1 && trng() < 0.22;
    const spread = 0.3 + trng() * 0.22;
    const lean = (trng() - 0.5) * 0.3;
    const lA = 0.68 + trng() * 0.16, lB = 0.68 + trng() * 0.16;
    b.kids.push(branch(-spread + lean + tropism, abs, len * lA, w * Math.sqrt(lA) * 0.74, d + 1));
    b.kids.push(branch(spread + lean + tropism, abs, len * lB, w * Math.sqrt(lB) * 0.74, d + 1));
    if (three) b.kids.push(branch(lean * 0.5 + tropism, abs, len * 0.6, w * 0.5, d + 1));
    if (d > 5 && trng() < 0.4) addLeaves(b, 1 + Math.floor(trng() * 2), 0.04);
    return a;
  }

  function buildTree() {
    const trunkSegs = [
      [0.03, 0.17, 0.16], [-0.08, 0.15, 0.135], [0.07, 0.1, 0.12]
    ];
    const root = node(trunkSegs[0][0], trunkSegs[0][1], trunkSegs[0][2], 0);
    let cur = root, abs = UP + trunkSegs[0][0];
    for (let i = 1; i < trunkSegs.length; i++) {
      const [a, l, w] = trunkSegs[i];
      const n = node(a, l, w, 0);
      cur.kids.push(n); cur = n; abs += a;
    }
    const forks = [[-0.72, 0.36, 0.085], [0.05, 0.3, 0.065], [0.68, 0.36, 0.085]];
    for (const [a, l, w] of forks) cur.kids.push(branch(a, abs, l, w, 1));
    return root;
  }

  const tree = buildTree();
  const roots = [];
  for (let i = 0; i < 8; i++) {
    const side = i % 2 ? 1 : -1;
    const ang = side > 0 ? 0.15 + trng() * 0.5 : Math.PI - 0.15 - trng() * 0.5;
    roots.push(growRoot(ang, 0.1 + trng() * 0.14, 0.045 + trng() * 0.03, 0));
  }
  function growRoot(a, len, w, d) {
    const n = { a, len, w, d, ph: trng() * TAU, kids: [], leaves: [] };
    if (d < 4 && len > 0.04) {
      const c = trng() < 0.5 ? 2 : 1;
      for (let i = 0; i < c; i++) {
        n.kids.push(growRoot((trng() - 0.5) * 0.9, len * (0.6 + trng() * 0.2), w * 0.62, d + 1));
      }
    }
    return n;
  }

  // Bounding box of the tree at rest, to fit it on screen.
  const bbox = { minX: 0, maxX: 0, minY: 0, maxY: 0 };
  (function measure(n, x, y, ang) {
    const a = ang + n.a;
    const x2 = x + Math.cos(a) * n.len, y2 = y + Math.sin(a) * n.len;
    bbox.minX = Math.min(bbox.minX, x2 - 0.08); bbox.maxX = Math.max(bbox.maxX, x2 + 0.08);
    bbox.minY = Math.min(bbox.minY, y2 - 0.08);
    for (const k of n.kids) measure(k, x2, y2, a);
  })(tree, 0, 0, -Math.PI / 2);

  // ---------- State ----------
  let W = 0, H = 0, DPR = 1;
  let skyLayer, frontLayer, vignetteLayer, treeC, tctx, bloomA, bctxA, bloomB, bctxB;
  let moon = { x: 0, y: 0, r: 0 };
  let base = { x: 0, y: 0 }, S = 1;
  let twinklers = [];
  let shooting = [];
  let petals = [];
  let fireflies = [];
  let leafPts = [];
  let nextShoot = 1.2;

  // Glow sprite for dots
  const sprite = (() => {
    const s = 64, c = makeCanvas(s, s), g = c.getContext('2d');
    const gr = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
    gr.addColorStop(0, 'rgba(255,255,255,1)');
    gr.addColorStop(0.15, 'rgba(220,240,255,0.9)');
    gr.addColorStop(0.4, 'rgba(110,190,255,0.35)');
    gr.addColorStop(1, 'rgba(40,110,255,0)');
    g.fillStyle = gr; g.fillRect(0, 0, s, s);
    return c;
  })();
  const blueSprite = (() => {
    const s = 64, c = makeCanvas(s, s), g = c.getContext('2d');
    const gr = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
    gr.addColorStop(0, 'rgba(200,235,255,1)');
    gr.addColorStop(0.2, 'rgba(90,180,255,0.8)');
    gr.addColorStop(0.55, 'rgba(40,120,255,0.22)');
    gr.addColorStop(1, 'rgba(20,60,255,0)');
    g.fillStyle = gr; g.fillRect(0, 0, s, s);
    return c;
  })();

  function hillY(x, seed, baseY, amp) {
    const u = x / W;
    return baseY
      - Math.sin(u * 3.1 + seed) * amp
      - Math.sin(u * 7.3 + seed * 2.1) * amp * 0.35
      - Math.sin(u * 17.0 + seed * 3.7) * amp * 0.08;
  }

  function nearHillY(x) {
    const d = (x - base.x) / (W * 0.55);
    return H * 0.9 - Math.exp(-d * d * 2.2) * H * 0.07 - Math.sin(x / W * 5 + 1) * H * 0.008;
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);

    const m = Math.min(W, H);
    moon.r = Math.max(60, m * 0.21);
    if (W >= H) { moon.x = W * 0.7; moon.y = H * 0.3; }
    else { moon.x = W * 0.6; moon.y = H * 0.24; }

    base.x = W >= H ? W * 0.4 : W * 0.5;
    base.y = nearHillY(base.x) + H * 0.004;
    const treeH = -bbox.minY, treeW = bbox.maxX - bbox.minX;
    S = Math.min((base.y - H * 0.1) / treeH, (W * 0.92) / treeW);

    buildSky();
    buildFront();
    buildVignette();

    treeC = makeCanvas(W * DPR, H * DPR); tctx = treeC.getContext('2d');
    bloomA = makeCanvas(W * DPR / 4, H * DPR / 4); bctxA = bloomA.getContext('2d');
    bloomB = makeCanvas(W * DPR / 12, H * DPR / 12); bctxB = bloomB.getContext('2d');

    twinklers = [];
    const n = Math.round(W * H / 6500);
    for (let i = 0; i < n; i++) {
      twinklers.push({
        x: rand() * W, y: Math.pow(rand(), 1.4) * H * 0.78,
        r: 0.6 + Math.pow(rand(), 3) * 1.8,
        ph: rand() * TAU, sp: 0.5 + rand() * 2.5
      });
    }
    fireflies = [];
    for (let i = 0; i < 46; i++) fireflies.push(newFirefly(true));
  }

  function buildSky() {
    skyLayer = makeCanvas(W * DPR, H * DPR);
    const g = skyLayer.getContext('2d');
    g.setTransform(DPR, 0, 0, DPR, 0, 0);

    const sky = g.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#01030d');
    sky.addColorStop(0.35, '#041033');
    sky.addColorStop(0.7, '#0a2357');
    sky.addColorStop(1, '#0f3170');
    g.fillStyle = sky; g.fillRect(0, 0, W, H);

    // faint milky band
    g.save();
    g.translate(W * 0.2, H * 0.1);
    g.rotate(0.45);
    const band = g.createLinearGradient(0, -H * 0.18, 0, H * 0.18);
    band.addColorStop(0, 'rgba(80,120,220,0)');
    band.addColorStop(0.5, 'rgba(90,130,230,0.07)');
    band.addColorStop(1, 'rgba(80,120,220,0)');
    g.fillStyle = band;
    g.fillRect(-W, -H * 0.18, W * 3, H * 0.36);
    g.restore();

    // static stars
    const srng = mulberry32(99);
    const count = Math.round(W * H / 900);
    for (let i = 0; i < count; i++) {
      const x = srng() * W, y = Math.pow(srng(), 1.3) * H * 0.85;
      const r = Math.pow(srng(), 4) * 1.3 + 0.25;
      const a = 0.25 + srng() * 0.6;
      const tint = srng();
      g.fillStyle = tint < 0.2 ? `rgba(255,230,210,${a})` : tint < 0.6 ? `rgba(200,220,255,${a})` : `rgba(255,255,255,${a})`;
      g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
    }

    // moon halo
    const R = moon.r;
    let gr = g.createRadialGradient(moon.x, moon.y, R * 0.9, moon.x, moon.y, R * 5);
    gr.addColorStop(0, 'rgba(170,205,255,0.32)');
    gr.addColorStop(0.15, 'rgba(110,160,255,0.14)');
    gr.addColorStop(0.45, 'rgba(60,110,230,0.05)');
    gr.addColorStop(1, 'rgba(30,70,200,0)');
    g.fillStyle = gr; g.fillRect(0, 0, W, H);

    // faint ring halo
    gr = g.createRadialGradient(moon.x, moon.y, R * 1.9, moon.x, moon.y, R * 2.3);
    gr.addColorStop(0, 'rgba(160,200,255,0)');
    gr.addColorStop(0.5, 'rgba(160,200,255,0.035)');
    gr.addColorStop(1, 'rgba(160,200,255,0)');
    g.fillStyle = gr; g.fillRect(0, 0, W, H);

    // moon disc
    g.save();
    g.beginPath(); g.arc(moon.x, moon.y, R, 0, TAU); g.clip();
    gr = g.createRadialGradient(moon.x - R * 0.25, moon.y - R * 0.3, R * 0.1, moon.x, moon.y, R);
    gr.addColorStop(0, '#fbfdff');
    gr.addColorStop(0.6, '#e6eef9');
    gr.addColorStop(1, '#c4d2e8');
    g.fillStyle = gr; g.fillRect(moon.x - R, moon.y - R, R * 2, R * 2);

    const mrng = mulberry32(2024);
    // maria (dark seas)
    const maria = [
      [-0.32, -0.28, 0.34], [0.05, -0.38, 0.26], [0.28, -0.05, 0.3], [-0.12, 0.1, 0.28],
      [0.12, 0.38, 0.2], [-0.45, 0.2, 0.18], [0.42, -0.4, 0.14], [-0.05, -0.12, 0.2]
    ];
    for (const [mx, my, mr] of maria) {
      for (let k = 0; k < 5; k++) {
        const cx = moon.x + (mx + (mrng() - 0.5) * 0.12) * R;
        const cy = moon.y + (my + (mrng() - 0.5) * 0.12) * R;
        const rr = mr * R * (0.5 + mrng() * 0.6);
        const mg = g.createRadialGradient(cx, cy, 0, cx, cy, rr);
        mg.addColorStop(0, 'rgba(120,140,175,0.22)');
        mg.addColorStop(0.7, 'rgba(120,140,175,0.12)');
        mg.addColorStop(1, 'rgba(120,140,175,0)');
        g.fillStyle = mg;
        g.beginPath(); g.arc(cx, cy, rr, 0, TAU); g.fill();
      }
    }
    // craters
    for (let i = 0; i < 70; i++) {
      const ang = mrng() * TAU, dist = Math.sqrt(mrng()) * R * 0.95;
      const cx = moon.x + Math.cos(ang) * dist, cy = moon.y + Math.sin(ang) * dist;
      const cr = Math.pow(mrng(), 2.5) * R * 0.09 + R * 0.008;
      g.fillStyle = 'rgba(110,128,160,0.12)';
      g.beginPath(); g.arc(cx, cy, cr, 0, TAU); g.fill();
      g.strokeStyle = 'rgba(255,255,255,0.14)';
      g.lineWidth = Math.max(0.5, cr * 0.18);
      g.beginPath(); g.arc(cx + cr * 0.12, cy + cr * 0.12, cr, Math.PI * 0.1, Math.PI * 0.9); g.stroke();
    }
    // bright ray crater
    {
      const cx = moon.x - R * 0.2, cy = moon.y + R * 0.55;
      for (let i = 0; i < 14; i++) {
        const a = mrng() * TAU, l = R * (0.15 + mrng() * 0.35);
        g.strokeStyle = 'rgba(255,255,255,0.07)';
        g.lineWidth = R * 0.012;
        g.beginPath(); g.moveTo(cx, cy); g.lineTo(cx + Math.cos(a) * l, cy + Math.sin(a) * l); g.stroke();
      }
      g.fillStyle = 'rgba(255,255,255,0.5)';
      g.beginPath(); g.arc(cx, cy, R * 0.025, 0, TAU); g.fill();
    }
    // limb darkening + cool tint
    gr = g.createRadialGradient(moon.x, moon.y, R * 0.55, moon.x, moon.y, R);
    gr.addColorStop(0, 'rgba(40,70,130,0)');
    gr.addColorStop(1, 'rgba(40,70,130,0.35)');
    g.fillStyle = gr; g.fillRect(moon.x - R, moon.y - R, R * 2, R * 2);
    g.restore();

    // inner rim glow
    gr = g.createRadialGradient(moon.x, moon.y, R * 0.98, moon.x, moon.y, R * 1.12);
    gr.addColorStop(0, 'rgba(230,240,255,0.5)');
    gr.addColorStop(1, 'rgba(180,210,255,0)');
    g.fillStyle = gr;
    g.beginPath(); g.arc(moon.x, moon.y, R * 1.12, 0, TAU); g.fill();
  }

  function buildFront() {
    frontLayer = makeCanvas(W * DPR, H * DPR);
    const g = frontLayer.getContext('2d');
    g.setTransform(DPR, 0, 0, DPR, 0, 0);

    // distant mountains
    const layers = [
      { seed: 1.3, y: H * 0.74, amp: H * 0.06, top: '#163a7a', bot: '#0b1d48', rim: 'rgba(150,190,255,0.25)' },
      { seed: 4.1, y: H * 0.8, amp: H * 0.04, top: '#0d2558', bot: '#081536', rim: 'rgba(130,175,255,0.18)' },
    ];
    for (const L of layers) {
      g.beginPath();
      g.moveTo(0, H);
      for (let x = 0; x <= W + 4; x += 4) g.lineTo(x, hillY(x, L.seed, L.y, L.amp));
      g.lineTo(W, H); g.closePath();
      const gr = g.createLinearGradient(0, L.y - L.amp * 1.5, 0, H);
      gr.addColorStop(0, L.top); gr.addColorStop(1, L.bot);
      g.fillStyle = gr; g.fill();
      g.beginPath();
      for (let x = 0; x <= W + 4; x += 4) {
        const y = hillY(x, L.seed, L.y, L.amp);
        x === 0 ? g.moveTo(x, y) : g.lineTo(x, y);
      }
      g.strokeStyle = L.rim; g.lineWidth = 1.2; g.stroke();

      // mist above each layer
      const mist = g.createLinearGradient(0, L.y - L.amp, 0, L.y + L.amp * 2);
      mist.addColorStop(0, 'rgba(90,140,240,0)');
      mist.addColorStop(0.6, 'rgba(90,140,240,0.10)');
      mist.addColorStop(1, 'rgba(90,140,240,0)');
      g.fillStyle = mist; g.fillRect(0, L.y - L.amp, W, L.amp * 3);
    }

    // near hill the tree stands on
    g.beginPath();
    g.moveTo(0, H);
    for (let x = 0; x <= W + 4; x += 4) g.lineTo(x, nearHillY(x));
    g.lineTo(W, H); g.closePath();
    const gr = g.createLinearGradient(0, H * 0.8, 0, H);
    gr.addColorStop(0, '#06102c');
    gr.addColorStop(1, '#02050f');
    g.fillStyle = gr; g.fill();

    // grass silhouettes on the hill
    const grng = mulberry32(55);
    g.strokeStyle = '#040a1f';
    g.lineCap = 'round';
    for (let x = 0; x < W; x += 2.2) {
      const y = nearHillY(x) + 1;
      const h = 3 + grng() * grng() * 14;
      const lean = (grng() - 0.5) * 6;
      g.lineWidth = 0.8 + grng();
      g.beginPath(); g.moveTo(x, y + 2); g.quadraticCurveTo(x + lean * 0.3, y - h * 0.5, x + lean, y - h); g.stroke();
    }
    // moonlit rim on the hill crest
    g.beginPath();
    for (let x = 0; x <= W + 4; x += 4) {
      const y = nearHillY(x);
      x === 0 ? g.moveTo(x, y) : g.lineTo(x, y);
    }
    g.strokeStyle = 'rgba(120,170,255,0.18)'; g.lineWidth = 1; g.stroke();
  }

  function buildVignette() {
    vignetteLayer = makeCanvas(W * DPR, H * DPR);
    const g = vignetteLayer.getContext('2d');
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    const gr = g.createRadialGradient(W / 2, H * 0.48, Math.min(W, H) * 0.35, W / 2, H * 0.5, Math.hypot(W, H) * 0.62);
    gr.addColorStop(0, 'rgba(0,0,8,0)');
    gr.addColorStop(1, 'rgba(0,0,8,0.6)');
    g.fillStyle = gr; g.fillRect(0, 0, W, H);
  }

  // ---------- Animated elements ----------
  function spawnShootingStar() {
    const dir = rand() < 0.7 ? -1 : 1;
    const ang = (0.25 + rand() * 0.35);
    const speed = Math.max(W, H) * (0.7 + rand() * 0.6);
    const x = dir < 0 ? W * (0.35 + rand() * 0.75) : W * (-0.1 + rand() * 0.6);
    const y = H * (rand() * 0.35);
    shooting.push({
      x, y,
      vx: Math.cos(ang) * speed * dir, vy: Math.sin(ang) * speed,
      life: 0, max: 0.7 + rand() * 0.9,
      len: 0.12 + rand() * 0.18,
      w: 1.4 + rand() * 1.4
    });
  }

  function drawShootingStars(dt) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    for (let i = shooting.length - 1; i >= 0; i--) {
      const s = shooting[i];
      s.life += dt;
      s.x += s.vx * dt; s.y += s.vy * dt;
      const t = s.life / s.max;
      if (t >= 1) { shooting.splice(i, 1); continue; }
      const fade = Math.sin(Math.PI * Math.min(1, t * 1.1));
      const tx = s.x - s.vx * s.len, ty = s.y - s.vy * s.len;
      const gr = ctx.createLinearGradient(s.x, s.y, tx, ty);
      gr.addColorStop(0, `rgba(255,255,255,${0.95 * fade})`);
      gr.addColorStop(0.15, `rgba(170,215,255,${0.6 * fade})`);
      gr.addColorStop(1, 'rgba(80,140,255,0)');
      ctx.strokeStyle = gr;
      ctx.lineWidth = s.w * 4;
      ctx.globalAlpha = 0.35;
      ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(tx, ty); ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.lineWidth = s.w;
      ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(tx, ty); ctx.stroke();
      const hs = 14 * s.w * fade;
      ctx.drawImage(sprite, s.x - hs / 2, s.y - hs / 2, hs, hs);
    }
    ctx.restore();
  }

  function newFirefly(anywhere) {
    const spanX = (bbox.maxX - bbox.minX) * S * 0.7;
    return {
      x: base.x + (rand() - 0.5) * spanX * 1.6,
      y: anywhere ? base.y - rand() * (-bbox.minY) * S * 1.05 : base.y - rand() * H * 0.1,
      vx: (rand() - 0.5) * 12, vy: -4 - rand() * 8,
      ph: rand() * TAU, sp: 0.8 + rand() * 2, r: 2 + rand() * 4,
      life: 0, max: 6 + rand() * 10
    };
  }

  // ---------- Tree rendering ----------
  const segs = [];
  function layoutBranch(n, x, y, ang, t, ys, dist) {
    const sway = n.d > 1
      ? Math.sin(t * 0.9 + n.ph) * 0.012 * n.d * 0.5 + Math.sin(t * 0.35 + n.d * 0.4) * 0.006 * n.d
      : 0;
    const a = ang + n.a + sway;
    const x2 = x + Math.cos(a) * n.len * S;
    const y2 = y + Math.sin(a) * n.len * S * ys;
    segs.push(x, y, x2, y2, n.w * S, n.d, dist, dist + n.len);
    for (const L of n.leaves) {
      leafPts.push(x2 + L.ox * S, y2 + L.oy * S, L);
    }
    for (const k of n.kids) layoutBranch(k, x2, y2, a, t, ys, dist + n.len);
  }

  function drawTree(t) {
    segs.length = 0;
    leafPts.length = 0;
    layoutBranch(tree, base.x, base.y + 4, -Math.PI / 2, t, 1, 0);
    const trunkSegCount = segs.length;
    for (const r of roots) layoutBranch(r, base.x, base.y + 2, 0, 0, 0.4, 0);

    const g = tctx;
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.clearRect(0, 0, treeC.width, treeC.height);
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    g.lineCap = 'round';
    g.lineJoin = 'round';

    const pulse = 0.85 + 0.15 * Math.sin(t * 1.3);

    // outer blue body
    for (let i = 0; i < segs.length; i += 8) {
      const w = Math.max(0.6, segs[i + 4]);
      const d = segs[i + 5];
      g.strokeStyle = d < 3 ? '#1f6dff' : d < 6 ? '#2f8cff' : '#45a8ff';
      g.lineWidth = w;
      g.beginPath(); g.moveTo(segs[i], segs[i + 1]); g.lineTo(segs[i + 2], segs[i + 3]); g.stroke();
    }
    // bright core
    g.globalCompositeOperation = 'lighter';
    for (let i = 0; i < segs.length; i += 8) {
      const w = Math.max(0.4, segs[i + 4] * 0.42);
      const d = segs[i + 5];
      g.strokeStyle = `rgba(${d < 4 ? 150 : 120},${210 + d * 3},255,${0.55 * pulse})`;
      g.lineWidth = w;
      g.beginPath(); g.moveTo(segs[i], segs[i + 1]); g.lineTo(segs[i + 2], segs[i + 3]); g.stroke();
    }
    // hot center line on major limbs
    for (let i = 0; i < trunkSegCount; i += 8) {
      const w = segs[i + 4];
      if (w < 2) continue;
      g.strokeStyle = `rgba(230,248,255,${0.35 * pulse})`;
      g.lineWidth = w * 0.12;
      g.beginPath(); g.moveTo(segs[i], segs[i + 1]); g.lineTo(segs[i + 2], segs[i + 3]); g.stroke();
    }
    // energy pulses travelling up from the roots to the branch tips
    for (let f = 0; f < 2; f++) {
      const front = ((t * 0.32 + f * 0.9) % 1.8);
      const fade = Math.min(1, (1.8 - front) * 1.5);
      for (let i = 0; i < trunkSegCount; i += 8) {
        const d0 = segs[i + 6], d1 = segs[i + 7];
        if (front < d0 || front >= d1) continue;
        const p = (front - d0) / (d1 - d0);
        const px = lerp(segs[i], segs[i + 2], p), py = lerp(segs[i + 1], segs[i + 3], p);
        const s = segs[i + 4] * 2.2 + 7;
        g.globalAlpha = 0.85 * fade;
        g.drawImage(sprite, px - s / 2, py - s / 2, s, s);
      }
    }
    g.globalAlpha = 1;

    // blossoms / leaves
    for (let i = 0; i < leafPts.length; i += 3) {
      const L = leafPts[i + 2];
      const tw = 0.55 + 0.45 * Math.sin(t * L.sp + L.ph);
      const s = (4 + L.s * 8) * (0.75 + tw * 0.35);
      g.globalAlpha = 0.3 + tw * 0.5;
      g.drawImage(L.hue < 0.12 ? sprite : blueSprite, leafPts[i] - s / 2, leafPts[i + 1] - s / 2, s, s);
    }
    g.globalAlpha = 1;
    g.globalCompositeOperation = 'source-over';
  }

  function bloom() {
    const fa = 'filter' in bctxA;
    bctxA.clearRect(0, 0, bloomA.width, bloomA.height);
    if (fa) bctxA.filter = `blur(${Math.max(2, 3 * DPR)}px)`;
    bctxA.drawImage(treeC, 0, 0, bloomA.width, bloomA.height);
    if (fa) bctxA.filter = 'none';

    bctxB.clearRect(0, 0, bloomB.width, bloomB.height);
    if (fa) bctxB.filter = `blur(${Math.max(2, 3 * DPR)}px)`;
    bctxB.drawImage(bloomA, 0, 0, bloomB.width, bloomB.height);
    if (fa) bctxB.filter = 'none';
  }

  // ---------- Main loop ----------
  let last = performance.now();
  const t0 = last;

  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    const t = (now - t0) / 1000;

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(skyLayer, 0, 0);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    // twinkling stars
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const s of twinklers) {
      const k = 0.5 + 0.5 * Math.sin(t * s.sp + s.ph);
      const sz = s.r * (3 + k * 5);
      ctx.globalAlpha = 0.25 + k * 0.75;
      ctx.drawImage(sprite, s.x - sz / 2, s.y - sz / 2, sz, sz);
    }
    ctx.restore();

    // shooting stars
    nextShoot -= dt;
    if (nextShoot <= 0) {
      spawnShootingStar();
      if (rand() < 0.2) spawnShootingStar();
      nextShoot = 0.8 + rand() * 2.4;
    }
    drawShootingStars(dt);

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(frontLayer, 0, 0);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    // light pool cast by the tree
    const treeHpx = -bbox.minY * S;
    const breath = 0.9 + 0.1 * Math.sin(t * 1.3);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.translate(base.x, base.y);
    ctx.scale(1, 0.22);
    let gr = ctx.createRadialGradient(0, 0, 0, 0, 0, treeHpx * 1.3);
    gr.addColorStop(0, `rgba(80,170,255,${0.55 * breath})`);
    gr.addColorStop(0.3, `rgba(40,110,255,${0.22 * breath})`);
    gr.addColorStop(1, 'rgba(20,60,200,0)');
    ctx.fillStyle = gr;
    ctx.beginPath(); ctx.arc(0, 0, treeHpx * 1.3, 0, TAU); ctx.fill();
    ctx.restore();

    // ambient aura around canopy
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const cy = base.y - treeHpx * 0.62;
    gr = ctx.createRadialGradient(base.x, cy, 0, base.x, cy, treeHpx * 0.9);
    gr.addColorStop(0, `rgba(50,130,255,${0.16 * breath})`);
    gr.addColorStop(1, 'rgba(30,80,255,0)');
    ctx.fillStyle = gr;
    ctx.fillRect(base.x - treeHpx, cy - treeHpx, treeHpx * 2, treeHpx * 2);
    ctx.restore();

    drawTree(t);
    bloom();

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.9;
    ctx.drawImage(bloomB, 0, 0, canvas.width, canvas.height);
    ctx.globalAlpha = 0.85;
    ctx.drawImage(bloomA, 0, 0, canvas.width, canvas.height);
    ctx.restore();
    ctx.drawImage(treeC, 0, 0);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.35;
    ctx.drawImage(treeC, 0, 0);
    ctx.restore();
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    // falling glowing petals
    if (leafPts.length && rand() < dt * 9) {
      const i = Math.floor(rand() * (leafPts.length / 3)) * 3;
      petals.push({ x: leafPts[i], y: leafPts[i + 1], vx: (rand() - 0.5) * 10, vy: 8 + rand() * 12, ph: rand() * TAU, life: 0, max: 5 + rand() * 6, s: 4 + rand() * 6 });
    }
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = petals.length - 1; i >= 0; i--) {
      const p = petals[i];
      p.life += dt;
      p.x += (p.vx + Math.sin(t * 1.5 + p.ph) * 14) * dt;
      p.y += p.vy * dt;
      const ground = nearHillY(p.x);
      if (p.life > p.max || p.y > ground + 2) { petals.splice(i, 1); continue; }
      const a = Math.min(1, p.life * 2) * (1 - p.life / p.max);
      ctx.globalAlpha = a;
      ctx.drawImage(blueSprite, p.x - p.s / 2, p.y - p.s / 2, p.s, p.s);
    }

    // fireflies / motes
    for (let i = 0; i < fireflies.length; i++) {
      const f = fireflies[i];
      f.life += dt;
      f.x += (f.vx + Math.sin(t * 0.7 + f.ph) * 10) * dt;
      f.y += (f.vy * 0.4 + Math.cos(t * 0.9 + f.ph) * 6) * dt;
      if (f.life > f.max) { fireflies[i] = newFirefly(false); continue; }
      const env = Math.min(1, f.life) * Math.min(1, (f.max - f.life));
      const k = 0.5 + 0.5 * Math.sin(t * f.sp * 2 + f.ph);
      ctx.globalAlpha = env * (0.3 + 0.7 * k);
      const s = f.r * (2 + k * 2);
      ctx.drawImage(sprite, f.x - s / 2, f.y - s / 2, s, s);
    }
    ctx.restore();

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(vignetteLayer, 0, 0);

    requestAnimationFrame(frame);
  }

  let resizeTimer = 0;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(resize, 60);
  });
  resize();
  for (let i = 0; i < 2; i++) spawnShootingStar();
  shooting.forEach((s, i) => { s.life = s.max * (0.25 + i * 0.2); s.x += s.vx * s.life; s.y += s.vy * s.life; });
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
