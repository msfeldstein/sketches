<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sand Iris</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000000;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    cursor: crosshair;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  const canvas = document.getElementById('c');
  const glOpts = {
    antialias: false,
    alpha: false,
    depth: false,
    premultipliedAlpha: false,
    preserveDrawingBuffer: true
  };
  let gl = canvas.getContext('webgl2', glOpts) || canvas.getContext('webgl', glOpts);

  function mulberry32(seed) {
    let a = seed >>> 0;
    return function() {
      a |= 0;
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Fast deterministic 2D & 3D integer hashes and 3D time-evolving rotated FBM noise
  function hash2i(x, y) {
    let h = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263);
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  }

  function hash3i(x, y, z) {
    let h = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul(z | 0, 1442695041);
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  }

  function noise3(x, y, z) {
    const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
    const xf = x - xi, yf = y - yi, zf = z - zi;
    const u = xf * xf * (3 - 2 * xf);
    const v = yf * yf * (3 - 2 * yf);
    const w = zf * zf * (3 - 2 * zf);

    const n000 = hash3i(xi, yi, zi),         n100 = hash3i(xi + 1, yi, zi);
    const n010 = hash3i(xi, yi + 1, zi),     n110 = hash3i(xi + 1, yi + 1, zi);
    const n001 = hash3i(xi, yi, zi + 1),     n101 = hash3i(xi + 1, yi, zi + 1);
    const n011 = hash3i(xi, yi + 1, zi + 1), n111 = hash3i(xi + 1, yi + 1, zi + 1);

    const nx00 = n000 + (n100 - n000) * u;
    const nx10 = n010 + (n110 - n010) * u;
    const nx01 = n001 + (n101 - n001) * u;
    const nx11 = n011 + (n111 - n011) * u;

    const nxy0 = nx00 + (nx10 - nx00) * v;
    const nxy1 = nx01 + (nx11 - nx01) * v;
    return nxy0 + (nxy1 - nxy0) * w;
  }

  function fbm(x, y, octaves = 4, z = 0) {
    let val = 0, amp = 0.5;
    let px = x, py = y, pz = z;
    for (let i = 0; i < octaves; i++) {
      val += amp * noise3(px, py, pz);
      // 3D Pythagorean orthonormal rotation * 2.02 across (x, y, time) to eliminate any lattice alignment
      const nx = (0.00 * px + 0.80 * py + 0.60 * pz) * 2.02 + 17.3;
      const ny = (-0.80 * px + 0.36 * py - 0.48 * pz) * 2.02 - 11.7;
      const nz = (-0.60 * px - 0.48 * py + 0.64 * pz) * 2.02 + 7.9;
      px = nx; py = ny; pz = nz;
      amp *= 0.5;
    }
    return val;
  }

  function smoothstep(e0, e1, x) {
    const t = Math.max(0, Math.min(1, (x - e0) / (e1 - e0)));
    return t * t * (3 - 2 * t);
  }

  function wrapAngle(a) {
    while (a > Math.PI) a -= Math.PI * 2;
    while (a < -Math.PI) a += Math.PI * 2;
    return a;
  }

  const TWO_PI = Math.PI * 2;

  // High-resolution 1D lookup tables for organic collarette wreath & pupil contour
  const LUT_N = 4096;
  const colLut = new Float32Array(LUT_N);
  const wobLut = new Float32Array(LUT_N);

  (function buildRingLuts() {
    for (let i = 0; i < LUT_N; i++) {
      const th = (i / LUT_N) * TWO_PI;
      const cx = Math.cos(th), sy = Math.sin(th);
      const wx = fbm(cx * 2.1 + 4.7, sy * 2.1 - 3.3, 3) - 0.5;
      const wy = fbm(cx * 2.1 - 8.2, sy * 2.1 + 6.1, 3) - 0.5;
      const broad = fbm(cx * 2.6 + wx * 1.3 + 8.3, sy * 2.6 + wy * 1.3 - 4.1, 4) - 0.5;
      const med = fbm(cx * 6.4 - 12.7, sy * 6.4 + 9.2, 4) - 0.5;
      // Organic trabecular arcade peaks via domain-warped ridge noise (no periodic sine teeth)
      const r1 = 0.5 - Math.abs(fbm(cx * 11.2 + wx * 2.1, sy * 11.2 + wy * 2.1, 3) - 0.5);
      const r2 = 0.5 - Math.abs(fbm(cx * 20.5 - 5.1, sy * 20.5 + 3.7, 2) - 0.5);
      colLut[i] = 0.312 + broad * 0.088 + med * 0.052 + (r1 - 0.32) * 0.108 + (r2 - 0.34) * 0.042;

      const pLow = (fbm(cx * 2.7 + 1.9, sy * 2.7 - 2.7, 3) - 0.5) * 0.011;
      const pFine = (fbm(cx * 19.0 - 4.2, sy * 19.0 + 7.1, 2) - 0.5) * 0.004;
      wobLut[i] = pLow + pFine;
    }
  })();

  function sampleLut(lut, theta) {
    let t = theta / TWO_PI;
    t = t - Math.floor(t);
    const f = t * LUT_N;
    const i0 = f | 0;
    const i1 = (i0 + 1) & (LUT_N - 1);
    return lut[i0] + (lut[i1] - lut[i0]) * (f - i0);
  }

  // Prebake 2D polar anatomical fields (crypt chasms, fiber deflection, ridges, furrows, stromal flow)
  // onto a 1440 x 384 polar grid so generating ~2.5M fine sand grains runs in ~150ms
  const ANG_RES = 1440;
  const RAD_RES = 384;
  const gridCrypt   = new Float32Array(ANG_RES * RAD_RES);
  const gridDeflect = new Float32Array(ANG_RES * RAD_RES);
  const gridRidge   = new Float32Array(ANG_RES * RAD_RES);
  const gridWall    = new Float32Array(ANG_RES * RAD_RES);
  const gridFlow    = new Float32Array(ANG_RES * RAD_RES);
  const gridTone    = new Float32Array(ANG_RES * RAD_RES);
  const gridFurrow  = new Float32Array(ANG_RES * RAD_RES);

  (function bakePolarAnatomy() {
    const rng = mulberry32(20261120);
    const nevi = [];

    // Subtle organic pigment clusters (softly feathered, never blocky)
    const nevAngles = [0.78, 2.28, 4.18];
    for (let i = 0; i < nevAngles.length; i++) {
      nevi.push({
        th: nevAngles[i] + (rng() - 0.5) * 0.10,
        u: 0.48 + rng() * 0.22,
        radU: 0.022 + rng() * 0.024,
        radTh: 0.026 + rng() * 0.028
      });
    }

    // First pass: organic continuous fibrous valley & sheaf field (no stamped geometric oval cutouts)
    const rawCrypt = new Float32Array(ANG_RES * RAD_RES);

    for (let a = 0; a < ANG_RES; a++) {
      const th = (a / ANG_RES) * TWO_PI;
      const cx = Math.cos(th), sy = Math.sin(th);
      const colU = sampleLut(colLut, th);

      const secVar = fbm(cx * 2.1 + 3.1, sy * 2.1 - 2.4, 4);
      const secMed = fbm(cx * 6.2 - 7.2, sy * 6.2 + 6.1, 3);
      const furrowMask = fbm(cx * 2.3 - 5.0, sy * 2.3 + 5.0, 2);
      const furrowPhaseShift = fbm(cx * 3.0, sy * 3.0, 2) * 2.4;

      for (let r = 0; r < RAD_RES; r++) {
        const u = r / (RAD_RES - 1);
        const idx = a * RAD_RES + r;

        // Silky stromal wave + subtle stylized sweep
        const wave = (fbm(cx * 3.4 + u * 2.3, sy * 3.4 - u * 2.3, 3) - 0.5) * 0.052 * Math.sin(u * Math.PI);
        gridFlow[idx] = wave + Math.sin(u * Math.PI) * 0.020;

        // Domain-warped anastomosing trabecular weave concentrated naturally around the collarette
        const warp = (fbm(cx * 4.5 + u * 3.2, sy * 4.5 - u * 3.2, 3) - 0.5) * 0.35;
        const wcx1 = Math.cos(th + u * 0.28 + warp * 0.22);
        const wsy1 = Math.sin(th + u * 0.28 + warp * 0.22);
        const wcx2 = Math.cos(th - u * 0.24 - warp * 0.20);
        const wsy2 = Math.sin(th - u * 0.24 - warp * 0.20);

        // Two counter-weaving radial-angular collagen wave sheets; where fibers part, soft recessed crypts form
        const weave1 = fbm(wcx1 * 13.5 + 4.1, wsy1 * 13.5 + u * 4.6 - 2.7, 3);
        const weave2 = fbm(wcx2 * 15.0 - 8.3, wsy2 * 15.0 - u * 4.2 + 5.9, 3);
        const fineSheaf = fbm(cx * 28.0 + warp, sy * 28.0 + u * 3.0, 2);

        // Anatomical envelope: true crypt recesses cluster organically around the collarette & inner pupillary zone,
        // fading smoothly into continuous, unbroken silky radial stroma across the outer ciliary zone
        const distCol = u - colU;
        const periCollarette = Math.exp(-Math.pow((distCol - 0.035) / 0.145, 2));
        const innerSpokeEnv  = (u < colU) ? (smoothstep(0.03, 0.10, u) * 0.68) : 0.0;
        const outerSoftSheaf = smoothstep(0.35, 0.55, u) * (1.0 - smoothstep(0.75, 0.94, u)) * 0.26;

        const combinedWeave = weave1 * 0.52 + weave2 * 0.48;
        const cryptOpening = smoothstep(0.46, 0.24, combinedWeave) * (periCollarette + innerSpokeEnv * 0.75);
        const sheafValley  = smoothstep(0.48, 0.26, fineSheaf) * (outerSoftSheaf + periCollarette * 0.28);

        rawCrypt[idx] = Math.min(1.0, cryptOpening * 0.92 + sheafValley);

        // Raised trabecular cord ridges where the two collagen sheets crest together
        const ridgeCrest = smoothstep(0.54, 0.78, combinedWeave) * (0.35 + periCollarette * 0.65);
        gridRidge[idx] = ridgeCrest;

        // Delicate concentric contraction ripples in the outer ciliary stroma
        let fur = 0.0;
        if (u > 0.52 && u < 0.88 && furrowMask > 0.40) {
          const fw = Math.sin((u - 0.53) * 54.0 + furrowPhaseShift);
          if (fw > 0.58) {
            fur = ((fw - 0.58) / 0.42) * 0.24 * smoothstep(0.40, 0.65, furrowMask);
          }
        }
        gridFurrow[idx] = fur;

        // Soft sector tonal locks + subtle pigment flecks
        let nevAmt = 0.0;
        for (let k = 0; k < nevi.length; k++) {
          const nv = nevi[k];
          const dth = wrapAngle(th - nv.th) / nv.radTh;
          const du = (u - nv.u) / nv.radU;
          const d2 = dth * dth + du * du;
          const edge = 1.0 + (secMed - 0.5) * 0.5;
          if (d2 < edge) {
            const fall = 1.0 - d2 / edge;
            nevAmt = Math.max(nevAmt, fall * fall);
          }
        }
        gridTone[idx] = (0.78 + secVar * 0.32 + secMed * 0.14) * (1.0 - nevAmt * 0.58);
      }
    }

    // Second pass: compute smooth angular gradient of crypt valleys so fibers part & curve organically around recesses
    for (let a = 0; a < ANG_RES; a++) {
      const aPrev = (a - 2 + ANG_RES) % ANG_RES;
      const aNext = (a + 2) % ANG_RES;
      for (let r = 0; r < RAD_RES; r++) {
        const idx = a * RAD_RES + r;
        const cCenter = rawCrypt[idx];
        const cPrev = rawCrypt[aPrev * RAD_RES + r];
        const cNext = rawCrypt[aNext * RAD_RES + r];
        // Push fibers away from higher crypt depth toward raised trabecular bridges
        const grad = (cPrev - cNext) * 0.5;
        gridCrypt[idx]   = cCenter;
        gridDeflect[idx] = grad * 0.026;
        gridWall[idx]    = grad * 2.2;
      }
    }
  })();

  function samplePolar(grid, theta, u) {
    let t = theta / TWO_PI;
    t = t - Math.floor(t);
    const af = t * ANG_RES;
    const a0 = af | 0;
    const a1 = (a0 + 1) % ANG_RES;
    const fa = af - a0;

    const uc = u < 0 ? 0 : (u > 1 ? 1 : u);
    const rf = uc * (RAD_RES - 1);
    const r0 = rf | 0;
    const r1 = r0 < RAD_RES - 1 ? r0 + 1 : r0;
    const fr = rf - r0;

    const base0 = a0 * RAD_RES;
    const base1 = a1 * RAD_RES;
    const v0 = grid[base0 + r0] + (grid[base0 + r1] - grid[base0 + r0]) * fr;
    const v1 = grid[base1 + r0] + (grid[base1 + r1] - grid[base1 + r0]) * fr;
    return v0 + (v1 - v0) * fa;
  }

  // Filmic high-definition monochrome tone curve: deep obsidian blacks, rich silky silver midtones, gleaming quartz highlights
  function silverToneCurve(x) {
    const v = Math.max(0, Math.min(1.4, x));
    const mapped = (v * (1.12 + v * 0.44)) / (1.0 + v * 0.72);
    const s = Math.max(0, Math.min(1, mapped));
    return Math.pow(s, 0.96);
  }

  // Grazing theatrical studio light from upper-left
  const LX = -0.75, LY = -0.66;

  function shadeIrisGrain(theta, u, colU, baseTone, cordProfile, rimRidge, wallSide, layerBoost) {
    const rx = Math.cos(theta), ry = Math.sin(theta);
    const macroDot = rx * LX + ry * LY;
    const tangDot = -ry * LX + rx * LY;

    const distCol = u - colU;
    const limbus = smoothstep(0.81, 0.996, u);

    // Sculpted collarette ridge topography
    const slopeSign = distCol >= 0 ? 1.0 : -1.0;
    const colSlope = Math.exp(-Math.pow(distCol / 0.11, 2)) * 0.62 + (distCol > 0 ? limbus * 0.34 : 0.24);
    const radialRelief = slopeSign * macroDot * colSlope;
    const crossRelief = wallSide * tangDot * 0.14;
    const furrow = samplePolar(gridFurrow, theta, u);

    // Dramatic chiaroscuro across the eye while keeping shadowed hairline fibers realistically legible
    const chiaroscuro = 0.30 + 0.96 * Math.pow(smoothstep(-0.95, 0.92, macroDot), 1.12);
    const eclipseRim = smoothstep(0.78, 0.95, u) * (1.0 - smoothstep(0.95, 1.0, u)) * Math.pow(Math.max(0, -macroDot), 1.55) * 0.30;

    const light = Math.max(0.11, chiaroscuro + radialRelief * 0.50 + crossRelief + rimRidge * 0.24 + eclipseRim + layerBoost - furrow);
    const limbalMask = 1.0 - limbus * 0.88;

    return silverToneCurve(baseTone * cordProfile * light * limbalMask);
  }

  // Generate high-definition DPR-scaled ultra-fine sand grain particles
  function buildSandSystem(outerRPx) {
    const rng = mulberry32(8812026);
    // Scale particle density smoothly with physical pixel area so Retina/4K stays razor-sharp & 60fps
    const areaScale = Math.max(1.0, Math.min(1.75, (outerRPx * outerRPx) / (430 * 430)));

    const pupilCount = Math.round(95000 * areaScale);
    const bedCount   = Math.round(170000 * areaScale);
    const feltCount  = Math.round(440000 * areaScale);
    const mainFibers = Math.round(3300 * Math.sqrt(areaScale));
    const mainSteps  = Math.round(240 * Math.sqrt(areaScale));
    const supFibers  = Math.round(1080 * Math.sqrt(areaScale));
    const supSteps   = Math.round(205 * Math.sqrt(areaScale));
    const ruffCount  = Math.round(52000 * areaScale);
    const mistCount  = Math.round(85000 * areaScale);

    const CAP = pupilCount + bedCount + feltCount + mainFibers * mainSteps + supFibers * Math.ceil(supSteps * 1.35) + ruffCount + mistCount + 16000;

    const stU     = new Float32Array(CAP);
    const stCos   = new Float32Array(CAP);
    const stSin   = new Float32Array(CAP);
    const stWob   = new Float32Array(CAP);
    const stLum   = new Float32Array(CAP);
    const stRad   = new Float32Array(CAP);
    const stAlpha = new Float32Array(CAP);
    const stPack  = new Float32Array(CAP);
    const stLayer = new Uint8Array(CAP);

    let n = 0;
    function emit(u, th, lum, radiusScale, alpha, layer, mode) {
      if (n >= CAP) return;
      const m = mode === true ? 1 : (mode === false ? 0 : mode);
      stU[n]     = u;
      stCos[n]   = Math.cos(th);
      stSin[n]   = Math.sin(th);
      stWob[n]   = m === 1 ? sampleLut(wobLut, th) : 0.0;
      stLum[n]   = lum;
      stRad[n]   = radiusScale;
      stAlpha[n] = alpha;
      stPack[n]  = rng() + m * 2.0;
      stLayer[n] = layer;
      n++;
    }

    // 1. Layer 0: Velvet-black crushed obsidian sand inside the pupil + dark volcanic basalt bed outside
    for (let i = 0; i < pupilCount; i++) {
      const th = rng() * TWO_PI;
      const rNorm = Math.sqrt(rng()) * 1.05;
      const edgeDark = smoothstep(0.66, 1.0, rNorm);
      const lum = (0.008 + rng() * 0.020) * (1.0 - edgeDark * 0.48) + (rng() < 0.008 ? 0.032 : 0.0);
      emit(-rNorm, th, lum, 0.56 + rng() * 0.34, 0.92, 0, false);
    }

    for (let i = 0; i < bedCount; i++) {
      const th = rng() * TWO_PI;
      const u = 0.965 + Math.pow(rng(), 0.84) * 1.58;
      const keyDir = Math.cos(th) * LX + Math.sin(th) * LY;
      const rimProx = Math.exp(-Math.max(0, u - 1.0) / 0.24);
      const beam = Math.max(0.14, 0.58 + 0.50 * keyDir) * Math.max(0.16, 1.10 - (u - 1.0) * 0.54);
      const lum = (0.012 + rng() * 0.028 + rimProx * 0.014) * beam;
      emit(u, th, lum, 0.54 + rng() * 0.38, 0.88, 0, false);
    }

    // 2. Layer 1: Continuous Fine Stromal Feltwork & Submerged Deep Crypt Fibers
    // Ensures 100% dense granular sand coverage across iris tissue (eliminating sparse mosaic pinholes)
    for (let i = 0; i < feltCount; i++) {
      const u = 0.008 + Math.pow(rng(), 0.92) * 0.988;
      const baseTh = rng() * TWO_PI;
      const th = baseTh + samplePolar(gridFlow, baseTh, u) * 0.65;
      const crypt = samplePolar(gridCrypt, th, u);
      const colU = sampleLut(colLut, th);
      const toneMod = samplePolar(gridTone, th, u);

      // Inside deep crypt openings, feltwork transitions smoothly to submerged graphite/obsidian shadow fibers
      const submergedThread = 0.75 + 0.5 * Math.sin(baseTh * 420.0);
      let baseTone;
      if (crypt > 0.08) {
        const depthAtten = Math.exp(-crypt * 2.8);
        baseTone = (0.21 * depthAtten + 0.032 * submergedThread * (1.0 - depthAtten)) * toneMod * (0.86 + rng() * 0.28);
      } else {
        const isInner = u < colU;
        baseTone = (isInner ? 0.145 : 0.215) * toneMod * (0.85 + rng() * 0.30);
      }

      const lum = shadeIrisGrain(th, u, colU, baseTone, 0.96, 0.0, 0.0, -0.02);
      emit(u, th, lum, 0.54 + rng() * 0.34, 0.88, 1, true);
    }

    // 3. Layer 2: Thousands of Feathered, Interweaving Hair-Fine Radial Ciliary & Sphincter Strands
    for (let f = 0; f < mainFibers; f++) {
      const baseTh = (f / mainFibers) * TWO_PI + (rng() - 0.5) * 0.0022;
      const strandBias = 0.86 + hash2i(f, 917) * 0.28;
      const fromPupil = (f % 3 !== 0);
      const uStart = fromPupil ? (0.006 + rng() * 0.018) : (0.22 + rng() * 0.10);
      const steps = fromPupil ? mainSteps : ((mainSteps * 0.78) | 0);
      const wigPhase = hash2i(f, 231) * TWO_PI;

      for (let s = 0; s < steps; s++) {
        const u = uStart + ((s + rng()) / steps) * (0.994 - uStart);
        const flow = samplePolar(gridFlow, baseTh, u) + Math.sin(u * 26.0 + wigPhase) * 0.0036;
        const rawTh = baseTh + flow;

        const deflect = samplePolar(gridDeflect, rawTh, u);
        const shiftedTh = rawTh + deflect;
        const crypt = samplePolar(gridCrypt, shiftedTh, u);
        const ridge = samplePolar(gridRidge, rawTh, u);

        // Softly feathered Gaussian collagen strand profile so adjacent strands blend into realistic tissue
        const cross = (rng() + rng() + rng() - 1.5) * 0.00145 / Math.max(0.30, 0.22 + u * 0.78);
        const th = shiftedTh + cross;
        const crossNorm = Math.min(1.0, Math.abs(cross) * 440.0);

        const colU = sampleLut(colLut, th);
        const colProx = Math.exp(-Math.pow((u - colU) / 0.088, 2));
        const toneMod = samplePolar(gridTone, th, u);

        let baseTone;
        if (u < colU) {
          const emerge = smoothstep(0.0, 0.085, u);
          baseTone = (0.18 + colProx * 0.26) * toneMod * (0.40 + 0.60 * emerge);
        } else {
          baseTone = (0.31 + colProx * 0.20) * toneMod * strandBias;
        }

        // Smoothly recess & shade strands dipping into organic fibrous valleys (no hard spot borders)
        const cryptSlopeFade = 0.20 + 0.80 * Math.exp(-crypt * 2.1);
        baseTone *= cryptSlopeFade;

        const grainVar = 0.80 + rng() * 0.40;
        const cordProfile = (1.14 - crossNorm * 0.34) * grainVar;
        const lum = shadeIrisGrain(th, u, colU, baseTone, cordProfile, ridge * 0.70, cross >= 0 ? 0.45 : -0.45, 0.0);
        const alpha = (0.86 - crossNorm * 0.22) * (0.45 + 0.55 * cryptSlopeFade);
        emit(u, th, lum, 0.40 + rng() * 0.32, alpha, 2, true);
      }
    }

    // 4. Layer 3: Superficial Interlocking Collarette Arcades & Gossamer Trabecular Bridges
    for (let f = 0; f < supFibers; f++) {
      const originTh = (f / supFibers) * TWO_PI + (rng() - 0.5) * 0.0045;
      const colOrigin = sampleLut(colLut, originTh);
      const isArcadeLoop = (f % 3 === 0);
      const isLongBridge = (f % 3 === 1);

      const uMin = isArcadeLoop
        ? Math.max(0.08, colOrigin - (0.05 + rng() * 0.06))
        : Math.max(0.06, colOrigin - (0.04 + rng() * 0.07));
      const uMax = isArcadeLoop
        ? Math.min(0.54, colOrigin + 0.05 + rng() * 0.08)
        : (isLongBridge ? (0.78 + rng() * 0.17) : Math.min(0.70, colOrigin + 0.12 + rng() * 0.18));

      const steps = isLongBridge ? supSteps : ((supSteps * 0.72) | 0);
      const bridgeSlant = (rng() - 0.5) * (isArcadeLoop ? 0.048 : 0.065);
      const archFreq = 4.5 + rng() * 4.5;
      const archPhase = rng() * TWO_PI;

      for (let s = 0; s < steps; s++) {
        const t = (s + rng()) / steps;

      float hash3(vec3 p) {

        p += dot(p, p.yxz + 33.33);
        return fract((p.x + p.y) * p.z);

        vec3 i = floor(x);
        vec3 f = fract(x);
        vec3 u = f * f * (3.0 - 2.0 * f);

        float n000 = hash3(i + vec3(0.0, 0.0, 0.0));
        float n100 = hash3(i + vec3(1.0, 0.0, 0.0));
        float n010 = hash3(i + vec3(0.0, 1.0, 0.0));
        float n110 = hash3(i + vec3(1.0, 1.0, 0.0));
        float n001 = hash3(i + vec3(0.0, 0.0, 1.0));

        vec2 crN = evalWeave(th + dTh, u, colU, z);

        vec2 offsetPx = (gl_PointCoord - 0.5) * v_pointSize;
        float distPx = length(offsetPx);

        // Crisp sub-pixel grain edge so microscopic sand particles stay distinct rather than painterly blur
        float cov = clamp((v_radiusPx + 0.36 - distPx) * 1.45, 0.0, 1.0) * v_alpha;
        if (cov < 0.004) discard;

        // Microscopic 3D faceted mineral sand shading responding to the slowly gliding raking light
        vec2 normXY = offsetPx / (v_radiusPx + 0.38);
        float r2 = min(1.0, dot(normXY, normXY));
        float nz = sqrt(max(0.04, 1.0 - r2));
        float facet = (v_seed - 0.5) * 0.58;
        vec3 normal = normalize(vec3(normXY.x + facet, normXY.y - facet * 0.7, nz));
        vec3 lightDir = normalize(vec3(u_lightDir, 0.48));

        float diff = max(0.0, dot(normal, lightDir));
        float microShade = 0.62 + 0.60 * diff;
        float spec = pow(max(0.0, diff), 7.0) * 0.22 * step(0.52, v_seed);

        float gray = clamp(v_lum * microShade + spec * v_lum, 0.0, 1.0);
        gl_FragColor = vec4(gray, gray, gray, cov);
      }
    `;

    function compile(type, src) {
      const s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      return gl.getShaderParameter(s, gl.COMPILE_STATUS) ? s : null;
    }

    const vs = compile(gl.VERTEX_SHADER, vsSource);
    const fs = compile(gl.FRAGMENT_SHADER, fsSource);
    const nvs = compile(gl.VERTEX_SHADER, noiseVsSource);
    const nfs = compile(gl.FRAGMENT_SHADER, noiseFsSource);
    if (vs && fs && nvs && nfs) {
      prog = gl.createProgram();
      gl.attachShader(prog, vs);
      gl.attachShader(prog, fs);
      gl.linkProgram(prog);

      noiseProg = gl.createProgram();
      gl.attachShader(noiseProg, nvs);
      gl.attachShader(noiseProg, nfs);
      gl.linkProgram(noiseProg);

      if (gl.getProgramParameter(prog, gl.LINK_STATUS) && gl.getProgramParameter(noiseProg, gl.LINK_STATUS)) {
        glReady = true;
      }
    }
  }

  if (glReady) {
    vbo = gl.createBuffer();
    quadVbo = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, quadVbo);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);

    const aQuad = gl.getAttribLocation(noiseProg, 'a_quad');
    uNoiseTime = gl.getUniformLocation(noiseProg, 'u_time');

    const aPos = gl.getAttribLocation(prog, 'a_posData');
    const aStyle = gl.getAttribLocation(prog, 'a_styleData');

    dispTex = gl.createTexture();
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, dispTex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

    noiseTex = gl.createTexture();
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, noiseTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, NOISE_W, NOISE_H, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

    noiseFbo = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, noiseFbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, noiseTex, 0);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);

    gl.useProgram(prog);
    uRes       = gl.getUniformLocation(prog, 'u_res');
    uDpr       = gl.getUniformLocation(prog, 'u_dpr');
    uOuterR    = gl.getUniformLocation(prog, 'u_outerR');
    uPupilFrac = gl.getUniformLocation(prog, 'u_pupilFrac');
    uTime      = gl.getUniformLocation(prog, 'u_time');
    uLightDir  = gl.getUniformLocation(prog, 'u_lightDir');
    gl.uniform1i(gl.getUniformLocation(prog, 'u_dispTex'), 0);
    gl.uniform1i(gl.getUniformLocation(prog, 'u_noiseTex'), 1);

    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.clearColor(0.0, 0.0, 0.0, 1.0);

    function uploadSandIfNeeded(outerR) {
      if (!sand || Math.abs(outerR - sand.builtOuterR) / Math.max(1, sand.builtOuterR) > 0.22) {
        sand = buildSandSystem(outerR);
        gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
        gl.bufferData(gl.ARRAY_BUFFER, sand.data, gl.STATIC_DRAW);
      }
    }

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 3);
      cssW = window.innerWidth;
      cssH = window.innerHeight;
      pw = Math.max(10, Math.round(cssW * dpr));
      ph = Math.max(10, Math.round(cssH * dpr));
      canvas.width = pw;
      canvas.height = ph;
      gl.viewport(0, 0, pw, ph);
      uploadSandIfNeeded(Math.min(pw, ph) * 0.415);
    }

    let resizeTimer = 0;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(resize, 60);
    });
    resize();

    function updateSandBrushField(outerR) {
      if (mouse.active && mouse.moved) {
        mouse.moved = false;
        const gx = (mouse.x / Math.max(1, cssW)) * GRID;
        const gy = (mouse.y / Math.max(1, cssH)) * GRID;
        const mvx = (mouse.x - mouse.px) / Math.max(1, cssW) * 4.2;
        const mvy = (mouse.y - mouse.py) / Math.max(1, cssH) * 4.2;
        const rad = Math.max(3.5, (outerR / Math.max(1, Math.max(pw, ph))) * GRID * 0.20);
        const rad2 = rad * rad;

        const minX = Math.max(0, Math.floor(gx - rad));
        const maxX = Math.min(GRID - 1, Math.ceil(gx + rad));
        const minY = Math.max(0, Math.floor(gy - rad));
        const maxY = Math.min(GRID - 1, Math.ceil(gy + rad));

        for (let y = minY; y <= maxY; y++) {
          const dy = y - gy;
          const row = y * GRID;
          for (let x = minX; x <= maxX; x++) {
            const dx = x - gx;
            const d2 = dx * dx + dy * dy;
            if (d2 < rad2 && d2 > 0.001) {
              const d = Math.sqrt(d2);
              const fall = 1.0 - d / rad;
              const push = fall * fall * 0.13;
              const idx = row + x;
              velX[idx] += (dx / d) * push + mvx * fall * 0.5;
              velY[idx] += (dy / d) * push + mvy * fall * 0.5;
            }
          }
        }
      }

      for (let i = 0; i < GRID * GRID; i++) {
        velX[i] = (velX[i] - dispX[i] * 0.048) * 0.82;
        velY[i] = (velY[i] - dispY[i] * 0.048) * 0.82;
        dispX[i] = Math.max(-0.98, Math.min(0.98, dispX[i] + velX[i]));
        dispY[i] = Math.max(-0.98, Math.min(0.98, dispY[i] + velY[i]));

        const nx = (dispX[i] * 0.5 + 0.5) * 255.0;
        const ny = (dispY[i] * 0.5 + 0.5) * 255.0;
        const ix = nx | 0, iy = ny | 0;
        const b = i << 2;
        dispTexBytes[b]     = ix;
        dispTexBytes[b + 1] = iy;
        dispTexBytes[b + 2] = ((nx - ix) * 255.0) | 0;
        dispTexBytes[b + 3] = ((ny - iy) * 255.0) | 0;
      }

      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, dispTex);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, GRID, GRID, 0, gl.RGBA, gl.UNSIGNED_BYTE, dispTexBytes);
    }

    const startTime = performance.now();
    const baseLightAng = Math.atan2(LY, LX);

    function renderScene(t) {
      const outerR = Math.min(pw, ph) * 0.415;
      // Slow, meditative physiological pupil breath (~24s primary wave + ~57s deep drift)
      const pupilFrac = 0.238 + Math.sin(t * 0.26) * 0.036 + Math.sin(t * 0.11 + 1.2) * 0.012;
      // Slow grazing key-light drift (~52s arc across the sand topography)
      const lightAng = baseLightAng + Math.sin(t * 0.12) * 0.46 + Math.sin(t * 0.051 + 0.9) * 0.16;

      updateSandBrushField(outerR);

      // Pass 1: Update 3D time-animated polar noise field FBO across all iris noise functions
      gl.bindFramebuffer(gl.FRAMEBUFFER, noiseFbo);
      gl.viewport(0, 0, NOISE_W, NOISE_H);
      gl.disable(gl.BLEND);
      gl.useProgram(noiseProg);
      gl.uniform1f(uNoiseTime, t);
      gl.bindBuffer(gl.ARRAY_BUFFER, quadVbo);
      gl.disableVertexAttribArray(aPos);
      gl.disableVertexAttribArray(aStyle);
      gl.enableVertexAttribArray(aQuad);
      gl.vertexAttribPointer(aQuad, 2, gl.FLOAT, false, 0, 0);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      gl.disableVertexAttribArray(aQuad);

      // Pass 2: Render ~2.2M fine sand particles driven by the time-evolving 3D noise field
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      gl.viewport(0, 0, pw, ph);
      gl.enable(gl.BLEND);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.useProgram(prog);
      gl.activeTexture(gl.TEXTURE1);
      gl.bindTexture(gl.TEXTURE_2D, noiseTex);
      gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
      gl.enableVertexAttribArray(aPos);
      gl.enableVertexAttribArray(aStyle);
      gl.vertexAttribPointer(aPos,   4, gl.FLOAT, false, 32, 0);
      gl.vertexAttribPointer(aStyle, 4, gl.FLOAT, false, 32, 16);

      gl.uniform2f(uRes, pw, ph);
      gl.uniform1f(uDpr, dpr);
      gl.uniform1f(uOuterR, outerR);
      gl.uniform1f(uPupilFrac, pupilFrac);
      gl.uniform1f(uTime, t);
      gl.uniform2f(uLightDir, Math.cos(lightAng), Math.sin(lightAng));

      gl.drawArrays(gl.POINTS, 0, sand.count);
    }

    function frame(now) {
      renderScene((now - startTime) * 0.001);
      requestAnimationFrame(frame);
    }

    renderScene(0);
    requestAnimationFrame(frame);
  } else {
    // High-DPI Canvas2D subpixel bilinear sand renderer fallback (replace canvas if WebGL claimed context)
    let activeCanvas = canvas;
    let ctx2d = activeCanvas.getContext('2d', { alpha: false });
    if (!ctx2d) {
      activeCanvas = canvas.cloneNode(false);
      canvas.parentNode.replaceChild(activeCanvas, canvas);
      ctx2d = activeCanvas.getContext('2d', { alpha: false });
    }
    let imgData = null, buf = null;

    function resize2d() {
      dpr = Math.min(window.devicePixelRatio || 1, 3);
      cssW = window.innerWidth;
      cssH = window.innerHeight;
      pw = Math.max(10, Math.round(cssW * dpr));
      ph = Math.max(10, Math.round(cssH * dpr));
      activeCanvas.width = pw;
      activeCanvas.height = ph;
      imgData = ctx2d.createImageData(pw, ph);
      buf = new Uint8Array(imgData.data.buffer);
      const outerR = Math.min(pw, ph) * 0.415;
      if (!sand || Math.abs(outerR - sand.builtOuterR) / Math.max(1, sand.builtOuterR) > 0.22) {
        sand = buildSandSystem(outerR);
      }
    }

    window.addEventListener('resize', resize2d);
    resize2d();

    const G2_A = 128, G2_R = 48;
    const dThGrid  = new Float32Array(G2_A * G2_R);
    const dRadGrid = new Float32Array(G2_A * G2_R);
    const lumGrid  = new Float32Array(G2_A * G2_R);
    const refFlow  = new Float32Array(G2_A * G2_R);
    const refRad   = new Float32Array(G2_A * G2_R);
    const refTone  = new Float32Array(G2_A * G2_R);

    function evalJsState(th, u, z) {
      const cx = Math.cos(th), sy = Math.sin(th);
      const colU = 0.312 + (fbm(cx * 2.6 + 8.3, sy * 2.6 - 4.1, 3, z * 0.7) - 0.5) * 0.11;
      const wob  = (fbm(cx * 2.7 + 1.9, sy * 2.7 - 2.7, 2, z * 0.8) - 0.5) * 0.014;
      const flow = (fbm(cx * 3.4 + u * 2.3, sy * 3.4 - u * 2.3, 3, z * 0.95 - u * 0.12) - 0.5) * 0.062 * Math.sin(u * Math.PI);
      const comb = 0.5 * fbm(cx * 13.5 + 4.1, sy * 13.5 + u * 4.6, 3, z * 1.1) + 0.5 * fbm(cx * 15.0 - 8.3, sy * 15.0 - u * 4.2, 3, -z * 1.05);
      const peri = Math.exp(-Math.pow((u - colU - 0.035) / 0.145, 2));
      const crypt = smoothstep(0.46, 0.24, comb) * peri;
      const ridge = smoothstep(0.54, 0.78, comb) * (0.35 + peri * 0.65);
      const sec  = 0.78 + fbm(cx * 2.1 + 3.1, sy * 2.1 - 2.4, 3, z * 0.6) * 0.38;
      const tone = Math.max(0.08, sec * (0.24 + 0.76 * Math.exp(-crypt * 2.0)) * (1.0 + ridge * 0.34));
      const radS = colU * Math.exp(-Math.pow((u - 0.32) / 0.25, 2)) + wob * (1.0 - smoothstep(0.0, 0.32, u));
      return [flow, radS, tone];
    }

    for (let a = 0; a < G2_A; a++) {
      const th = (a / G2_A) * TWO_PI;
      for (let r = 0; r < G2_R; r++) {
        const s0 = evalJsState(th, r / (G2_R - 1), 0);
        const k = a * G2_R + r;
        refFlow[k] = s0[0]; refRad[k] = s0[1]; refTone[k] = s0[2];
      }
    }

    const startTime = performance.now();
    function frame2d(now) {
      const t = (now - startTime) * 0.001;
      const z = t * 0.032;
      for (let a = 0; a < G2_A; a++) {
        const th = (a / G2_A) * TWO_PI;
        for (let r = 0; r < G2_R; r++) {
          const st = evalJsState(th, r / (G2_R - 1), z);
          const k = a * G2_R + r;
          dThGrid[k]  = st[0] - refFlow[k];
          dRadGrid[k] = st[1] - refRad[k];
          lumGrid[k]  = st[2] / refTone[k];
        }
      }

      buf.fill(0);
      for (let i = 3; i < buf.length; i += 4) buf[i] = 255;

      const cx = pw * 0.5, cy = ph * 0.5;
      const outerR = Math.min(pw, ph) * 0.415;
      const pupilFrac = 0.238 + Math.sin(t * 0.26) * 0.036 + Math.sin(t * 0.11 + 1.2) * 0.012;
      const slowSpin = Math.sin(t * 0.045) * 0.028 + t * 0.0035;
      const data = sand.data;

      for (let i = 0, end = sand.count * 8; i < end; i += 8) {
        const u = data[i];
        const sm = data[i + 7];
        const isMist = sm >= 3.5;
        const isIris = !isMist && sm >= 1.5;
        const seed = sm - (isIris ? 2.0 : (isMist ? 4.0 : 0.0));
        const pf = pupilFrac + data[i + 3];

        const ang0 = Math.atan2(data[i + 2], data[i + 1]);
        const ai = (((ang0 / TWO_PI + 1.0) % 1.0) * G2_A) | 0;
        const ri = (Math.max(0, Math.min(1, isIris ? u : 0.99)) * (G2_R - 1)) | 0;
        const gk = ai * G2_R + ri;

        let rFrac, aScale = 1.0, lScale = 1.0;
        let angShift = slowSpin;
        if (isIris) {
          angShift += dThGrid[gk];
          const uAnim = Math.max(-0.018, Math.min(1.0, u + dRadGrid[gk] * (0.25 + 0.75 * Math.sin(Math.max(0, Math.min(1, u)) * Math.PI))));
          rFrac = pf + uAnim * (1.0 - pf);
          lScale = Math.min(1.8, lumGrid[gk]);
        } else if (isMist) {
          const life = (seed * 13.37 + t * (0.014 + 0.013 * ((seed * 7.31) % 1))) % 1;
          const ease = Math.pow(life, 1.35);
          rFrac = 1.0 + (0.986 + ease * u - 1.0) * 0.78;
          aScale = smoothstep(0.0, 0.14, life) * (1.0 - smoothstep(0.45, 1.0, life));
          lScale = 1.0 - ease * 0.62;
        } else {
          rFrac = u < 0 ? (-u) * pf : 1.0 + (u - 1.0) * 0.76;
        }

        const cs = Math.cos(angShift), ss = Math.sin(angShift);

        const rx = data[i + 1] * cs - data[i + 2] * ss;
        const ry = data[i + 1] * ss + data[i + 2] * cs;
        const x = cx + rx * rFrac * outerR;
        const y = cy + ry * rFrac * outerR;
        const ix = x | 0, iy = y | 0;
        if (ix < 1 || ix >= pw - 2 || iy < 1 || iy >= ph - 2) continue;

        const fx = x - ix, fy = y - iy;
        const lum = (data[i + 4] * lScale * 255) | 0;
        const hi = lum < 235 ? lum + 20 : 255;
        const sh = (lum * 204) >> 8;
        const baseA = data[i + 6] * aScale * 245;

        const w00 = ((1 - fx) * (1 - fy) * baseA) | 0;
        const w10 = (fx * (1 - fy) * baseA) | 0;
        const w01 = ((1 - fx) * fy * baseA) | 0;
        const w11 = (fx * fy * baseA) | 0;

        const i00 = (iy * pw + ix) << 2;
        const i01 = i00 + (pw << 2);

        const c00 = buf[i00] + (((hi  - buf[i00]) * w00) >> 8);
        buf[i00] = buf[i00 + 1] = buf[i00 + 2] = c00;

        const c10 = buf[i00 + 4] + (((lum - buf[i00 + 4]) * w10) >> 8);
        buf[i00 + 4] = buf[i00 + 5] = buf[i00 + 6] = c10;

        const c01 = buf[i01] + (((lum - buf[i01]) * w01) >> 8);
        buf[i01] = buf[i01 + 1] = buf[i01 + 2] = c01;

        const c11 = buf[i01 + 4] + (((sh  - buf[i01 + 4]) * w11) >> 8);
        buf[i01 + 4] = buf[i01 + 5] = buf[i01 + 6] = c11;
      }

      ctx2d.putImageData(imgData, 0, 0);
      requestAnimationFrame(frame2d);
    }

    requestAnimationFrame(frame2d);
  }
})();
</script>
