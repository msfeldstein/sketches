<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sand Iris</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000000;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    cursor: crosshair;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { alpha: false });

  let width = 0, height = 0, pw = 0, ph = 0, dpr = 1;
  let imgData = null;
  let frameBuf = null;
  let bedBuf = null;

  // Structure-of-Arrays for ~240k dynamic monochrome sand grains
  let count = 0;
  let pU, pCos, pSin, pWobble, pX, pY, pVX, pVY;
  let pLum, pSize, pLayer, pGlint;

  let mouse = { x: 0, y: 0, vx: 0, vy: 0, active: false };

  function mulberry32(seed) {
    let a = seed >>> 0;
    return function() {
      a |= 0;
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function hash2(x, y) {
    let n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453123;
    return n - Math.floor(n);
  }

  function noise2(x, y) {
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = x - xi, yf = y - yi;
    const u = xf * xf * (3 - 2 * xf);
    const v = yf * yf * (3 - 2 * yf);
    const a = hash2(xi, yi);
    const b = hash2(xi + 1, yi);
    const c = hash2(xi, yi + 1);
    const d = hash2(xi + 1, yi + 1);
    return (a * (1 - u) + b * u) * (1 - v) + (c * (1 - u) + d * u) * v;
  }

  function fbm(x, y, octaves = 4) {
    let val = 0, amp = 0.5, freq = 1;
    for (let i = 0; i < octaves; i++) {
      val += amp * noise2(x * freq, y * freq);
      freq *= 2.03;
      amp *= 0.5;
    }
    return val;
  }

  function wrapAngle(a) {
    while (a > Math.PI) a -= Math.PI * 2;
    while (a < -Math.PI) a += Math.PI * 2;
    return a;
  }

  // Stylized, high-drama star-crowned autonomic wreath (collarette)
  function collaretteU(theta) {
    const cx = Math.cos(theta), sy = Math.sin(theta);
    const broad = fbm(cx * 2.4 + 8.3, sy * 2.4 - 4.1, 4) - 0.5;
    const medium = fbm(cx * 5.8 - 12.7, sy * 5.8 + 9.2, 3) - 0.5;
    // Crisp sculpted gothic/star peaks where radial trabecular arches converge
    const starWave = Math.abs(Math.sin(theta * 13.0 + broad * 4.4 + medium * 2.4));
    const points = Math.pow(starWave, 1.55) - 0.42;
    const secondary = (Math.abs(Math.sin(theta * 26.0 - medium * 5.0)) - 0.5) * 0.024;
    return 0.31 + broad * 0.095 + medium * 0.045 + points * 0.088 + secondary;
  }

  // Generate stylized anatomical features: dramatic lancet Crypts of Fuchs & dark graphite clusters
  const crypts = [];
  const freckles = [];
  (function initAnatomy() {
    const rng = mulberry32(20261118);
    // Primary deep lancet crypts radiating outside collarette
    for (let i = 0; i < 38; i++) {
      const th = (i / 38) * Math.PI * 2 + (rng() - 0.5) * 0.12;
      const col = collaretteU(th);
      const u = col + 0.04 + rng() * 0.25;
      crypts.push({
        th,
        u,
        wTh: 0.036 + rng() * 0.052,
        wU: 0.075 + rng() * 0.125,
        depth: 0.78 + rng() * 0.22
      });
    }
    // Secondary elongated mid-stroma chasms
    for (let i = 0; i < 28; i++) {
      const th = rng() * Math.PI * 2;
      const u = 0.50 + rng() * 0.28;
      crypts.push({
        th,
        u,
        wTh: 0.024 + rng() * 0.036,
        wU: 0.058 + rng() * 0.095,
        depth: 0.60 + rng() * 0.35
      });
    }
    // Inner pupillary-zone spoke chasms
    for (let i = 0; i < 26; i++) {
      const th = (i / 26) * Math.PI * 2 + (rng() - 0.5) * 0.15;
      const col = collaretteU(th);
      crypts.push({
        th,
        u: 0.09 + rng() * Math.max(0.05, col - 0.14),
        wTh: 0.038 + rng() * 0.046,
        wU: 0.052 + rng() * 0.068,
        depth: 0.72 + rng() * 0.28
      });
    }
    // Dark magnetite/obsidian sand flecks for dramatic graphic accent
    const freckleAngles = [0.68, 2.18, 2.34, 4.42, 5.55];
    for (let i = 0; i < freckleAngles.length; i++) {
      freckles.push({
        th: freckleAngles[i] + (rng() - 0.5) * 0.14,
        u: 0.44 + rng() * 0.30,
        radU: 0.022 + rng() * 0.026,
        radTh: 0.028 + rng() * 0.032
      });
    }
  })();

  // Evaluate crypt chasm depth & sculpt dramatic parting arches around each diamond opening
  function evalCryptsAndDeflect(theta, u) {
    let deflection = 0;
    let maxCrypt = 0;
    let rimRidge = 0;
    for (let i = 0; i < crypts.length; i++) {
      const c = crypts[i];
      const du = (u - c.u) / c.wU;
      if (du < -1.25 || du > 1.25) continue;
      const dth = wrapAngle(theta - c.th) / c.wTh;
      if (dth < -1.9 || dth > 1.9) continue;

      const longitudinal = 1.0 - Math.abs(du);
      if (longitudinal <= 0) continue;
      const halfWidth = Math.pow(longitudinal, 0.85) * 0.96 + 0.04;
      const normLat = Math.abs(dth) / halfWidth;

      if (normLat < 1.0) {
        const inside = (1.0 - normLat * normLat) * longitudinal * c.depth;
        if (inside > maxCrypt) maxCrypt = inside;
      }
      if (normLat < 1.75) {
        const sign = dth >= 0 ? 1 : -1;
        const push = Math.exp(-normLat * normLat * 1.2) * longitudinal * c.wTh * 0.92 * c.depth;
        deflection += sign * push;
        if (normLat > 0.68 && normLat < 1.44) {
          const ridge = Math.exp(-Math.pow((normLat - 1.03) / 0.20, 2)) * longitudinal * c.depth;
          if (ridge > rimRidge) rimRidge = ridge;
        }
      }
    }
    return { theta: theta + deflection, crypt: maxCrypt, rimRidge };
  }

  function blendGray(buf, idx, v, a256) {
    const cur = buf[idx];
    const out = cur + (((v - cur) * a256) >> 8);
    buf[idx]     = out;
    buf[idx + 1] = out;
    buf[idx + 2] = out;
  }

  function shadowGray(buf, idx, mul256) {
    const out = (buf[idx] * mul256) >> 8;
    buf[idx]     = out;
    buf[idx + 1] = out;
    buf[idx + 2] = out;
  }

  // Render a single 3D faceted monochrome grain of sand with stark raking chiaroscuro
  function splatGrain(buf, w, h, x, y, lum, sizeType, castShadow) {
    const ix = x | 0;
    const iy = y | 0;
    if (ix < 2 || ix >= w - 4 || iy < 2 || iy >= h - 4) return;

    const fx = x - ix;
    const fy = y - iy;
    const row = iy * w;

    if (sizeType === 0) {
      if (castShadow) {
        shadowGray(buf, ((iy + 1) * w + ix + 1) << 2, 162);
      }
      const w00 = ((1 - fx) * (1 - fy) * 238) | 0;
      const w10 = (fx * (1 - fy) * 224) | 0;
      const w01 = ((1 - fx) * fy * 224) | 0;
      const w11 = (fx * fy * 210) | 0;

      const hi = lum < 232 ? lum + 23 : 255;
      const sh = (lum * 188) >> 8;

      const i00 = (row + ix) << 2;
      blendGray(buf, i00, hi, w00);
      blendGray(buf, i00 + 4, lum, w10);
      const i01 = i00 + (w << 2);
      blendGray(buf, i01, lum, w01);
      blendGray(buf, i01 + 4, sh, w11);
    } else if (sizeType === 1) {
      if (castShadow) {
        const sRow1 = (iy + 1) * w;
        const sRow2 = (iy + 2) * w;
        shadowGray(buf, (sRow1 + ix + 2) << 2, 138);
        shadowGray(buf, (sRow2 + ix + 1) << 2, 138);
        shadowGray(buf, (sRow2 + ix + 2) << 2, 168);
      }
      const hi = Math.min(255, ((lum * 308) >> 8) + 14);
      const sh = (lum * 172) >> 8;

      const i00 = (row + ix) << 2;
      const i01 = i00 + (w << 2);
      blendGray(buf, i00, hi, 246);
      blendGray(buf, i00 + 4, lum, 214);
      blendGray(buf, i01, lum, 214);
      blendGray(buf, i01 + 4, sh, 228);
      blendGray(buf, i00 - 4, hi, ((1 - fx) * 98) | 0);
      blendGray(buf, i00 - (w << 2), hi, ((1 - fy) * 98) | 0);
    } else {
      if (castShadow) {
        const sRow1 = (iy + 1) * w;
        const sRow2 = (iy + 2) * w;
        const sRow3 = (iy + 3) * w;
        shadowGray(buf, (sRow1 + ix + 2) << 2, 122);
        shadowGray(buf, (sRow2 + ix + 1) << 2, 122);
        shadowGray(buf, (sRow2 + ix + 2) << 2, 128);
        shadowGray(buf, (sRow3 + ix + 2) << 2, 178);
      }
      const hi = Math.min(255, ((lum * 324) >> 8) + 22);
      const sh = (lum * 156) >> 8;

      const rowM1 = (iy - 1) * w;
      const rowP1 = (iy + 1) * w;

      blendGray(buf, (rowM1 + ix - 1) << 2, hi,  118);
      blendGray(buf, (rowM1 + ix) << 2,     hi,  222);
      blendGray(buf, (rowM1 + ix + 1) << 2, lum, 96);

      blendGray(buf, (row + ix - 1) << 2,   hi,  222);
      blendGray(buf, (row + ix) << 2,       hi,  252);
      blendGray(buf, (row + ix + 1) << 2,   lum, 218);

      blendGray(buf, (rowP1 + ix - 1) << 2, lum, 96);
      blendGray(buf, (rowP1 + ix) << 2,     lum, 218);
      blendGray(buf, (rowP1 + ix + 1) << 2, sh,  176);
    }
  }

  function buildStaticSandBed() {
    bedBuf = new Uint8Array(pw * ph * 4);
    for (let i = 3; i < bedBuf.length; i += 4) {
      bedBuf[i] = 255;
    }

    const rng = mulberry32(9918273);
    const cx = pw * 0.5;
    const cy = ph * 0.5;
    const minDim = Math.min(pw, ph);
    const outerR = minDim * 0.405;
    const pupilR = outerR * 0.24;

    // Dramatic dark obsidian & black-slate sand bed with raking spotlight falloff
    const bedGrains = Math.min(180000, Math.floor((pw * ph) / 9));
    for (let i = 0; i < bedGrains; i++) {
      const x = rng() * (pw - 8) + 4;
      const y = rng() * (ph - 8) + 4;
      const dx = x - cx;
      const dy = y - cy;
      const dist = Math.hypot(dx, dy);

      if (dist > pupilR * 1.16 && dist < outerR * 0.94) continue;

      if (dist <= pupilR * 1.16) {
        // Abyssal velvet-black crushed obsidian inside pupil void
        const edgeShadow = smoothstep(pupilR * 0.65, pupilR * 1.0, dist);
        const base = (2 + rng() * 5) * (1.0 - edgeShadow * 0.45);
        const glint = rng() < 0.015 ? 9 : 0;
        splatGrain(bedBuf, pw, ph, x, y, (base + glint) | 0, 0, false);
      } else {
        // Dark volcanic slate sand bed with dramatic diagonal raking beam from top-left
        const rimProx = Math.exp(-Math.max(0, dist - outerR) / (outerR * 0.28));
        const keyBeam = Math.max(0.18, 0.72 + 0.55 * ((-dx / minDim) * 0.72 - (dy / minDim) * 0.69));
        const vignette = Math.max(0.25, 1.08 - (dist / (minDim * 0.78)) * 0.65);
        const v = (6 + rng() * 13 + rimProx * 7) * keyBeam * vignette;
        const sz = rng() < 0.16 ? 1 : 0;
        splatGrain(bedBuf, pw, ph, x, y, v | 0, sz, sz > 0);
      }
    }
  }

  function smoothstep(e0, e1, x) {
    const t = Math.max(0, Math.min(1, (x - e0) / (e1 - e0)));
    return t * t * (3 - 2 * t);
  }

  function contrastCurve(x) {
    // Stark noir / silver-gelatin chiaroscuro S-curve
    const c = Math.max(0, Math.min(1, x));
    const s = c * c * (3 - 2 * c);
    return Math.pow(s, 1.32);
  }

  function buildParticles() {
    const rng = mulberry32(4202026);
    const minDim = Math.min(pw, ph);
    const outerR = minDim * 0.405;
    const pupilFrac = 0.24;

    const targetTotal = Math.max(210000, Math.min(270000, Math.floor(outerR * outerR * 1.28)));
    const temp = [];

    const mainBundles = 270;
    const superBundles = 118;
    const sphincterSpokes = 210;

    // Dramatic grazing spotlight from upper-left
    const lx = -0.76, ly = -0.65;

    for (let i = 0; i < targetTotal; i++) {
      const roleRoll = rng();
      let u, theta, layer = 1, sizeType = 0, glint = 0;
      let lum = 0;

      if (roleRoll < 0.105) {
        // 1. Stylized wind-eroded sand plumes sweeping off the outer iris rim into the void
        const plumeIdx = Math.floor(rng() * 140);
        // Bias more plumes toward the dramatic windward-to-leeward diagonal sweep
        let baseTh = (plumeIdx / 140) * Math.PI * 2;
        if (rng() < 0.55) {
          baseTh = Math.atan2(-ly, -lx) + (rng() + rng() - 1.0) * 1.35;
        }
        const leeward = Math.max(0, -(Math.cos(baseTh) * lx + Math.sin(baseTh) * ly));
        const maxDrift = 0.10 + Math.pow(leeward, 1.4) * 0.46;
        const falloff = Math.pow(rng(), 1.65);
        u = 0.965 + falloff * maxDrift;
        // Sweeping wind curl pulling loose sand grains toward bottom-right
        theta = baseTh + (rng() - 0.5) * (0.014 + falloff * 0.055) + falloff * falloff * (0.14 * Math.sin(baseTh - 0.72));

        const mineral = rng();
        if (mineral < 0.42) {
          lum = 22 + rng() * 38;
        } else if (mineral < 0.78) {
          lum = 118 + rng() * 72;
        } else {
          lum = 205 + rng() * 50;
          glint = 0.5 + rng() * 0.5;
        }
        lum *= (1.0 - falloff * 0.52) * (0.55 + leeward * 0.65);
        sizeType = rng() < 0.22 ? 2 : (rng() < 0.64 ? 1 : 0);
        layer = 2;
        if (glint === 0 && rng() < 0.25) glint = rng() * 0.85;
      } else if (roleRoll < 0.155) {
        // 2. Jagged dark obsidian pupillary ruff with spiky inward filaments framing the black void
        const spikeCount = 64;
        const spikePhase = rng() * spikeCount;
        const spikeCenter = Math.floor(spikePhase) + 0.5;
        const distFromSpike = Math.abs(spikePhase - spikeCenter) * 2.0;
        theta = (spikePhase / spikeCount) * Math.PI * 2;
        const spikeIn = Math.pow(Math.max(0, 1.0 - distFromSpike), 1.8) * 0.028;
        u = -spikeIn + rng() * 0.036;

        // Subtle grazing catchlight only on the far lower-right inner rim; deep obsidian elsewhere
        const inwardDot = -Math.cos(theta) * lx - Math.sin(theta) * ly;
        const rimCatch = Math.pow(Math.max(0, inwardDot), 2.6);
        lum = 10 + rng() * 24 + rimCatch * (68 + rng() * 55);
        if (rimCatch > 0.45 && rng() < 0.14) glint = 0.45 + rng() * 0.55;
        sizeType = rng() < 0.52 ? 1 : 0;
        layer = 2;
      } else {
        // 3. Stylized Chiaroscuro Stroma, Gothic Star Collarette & Sweeping Silver Ribbons
        const zoneRoll = rng();
        let isSuperficial = false;
        let isDeepBed = false;

        if (zoneRoll < 0.27) {
          u = 0.03 + Math.pow(rng(), 0.88) * 0.42;
        } else if (zoneRoll < 0.45) {
          isSuperficial = true;
          u = 0.22 + Math.pow(rng(), 0.80) * 0.72;
        } else if (zoneRoll < 0.58) {
          isDeepBed = true;
          u = 0.03 + rng() * 0.96;
        } else {
          u = 0.025 + Math.pow(rng(), 0.92) * 0.975;
        }

        // Bold stylized S-curve vortex sweep & crisp razor-like fiber cords
        let cordCenterOffset = 0;
        const torsion = Math.sin(u * Math.PI * 1.05) * 0.072 - u * 0.035;

        if (isSuperficial) {
          const bIdx = Math.floor(rng() * superBundles);
          const baseTh = (bIdx / superBundles) * Math.PI * 2;
          const spread = (rng() + rng() - 1.0) * ((Math.PI * 2) / superBundles) * 0.30;
          cordCenterOffset = Math.abs(spread) / (((Math.PI * 2) / superBundles) * 0.30);
          const arch = Math.sin(u * 6.4 + hash2(bIdx, 3.1) * 6.28) * 0.042 * (1 - u * 0.3);
          theta = baseTh + spread + arch + torsion;
        } else if (u < 0.31 && !isDeepBed) {
          const bIdx = Math.floor(rng() * sphincterSpokes);
          const baseTh = (bIdx / sphincterSpokes) * Math.PI * 2;
          const spread = (rng() + rng() - 1.0) * ((Math.PI * 2) / sphincterSpokes) * 0.40;
          cordCenterOffset = Math.abs(spread) / (((Math.PI * 2) / sphincterSpokes) * 0.40);
          const wave = (fbm(Math.cos(baseTh) * 5 + u * 4, Math.sin(baseTh) * 5 - u * 4, 2) - 0.5) * 0.042;
          theta = baseTh + spread + wave + torsion * 0.45;
        } else if (!isDeepBed) {
          const bIdx = Math.floor(rng() * mainBundles);
          const baseTh = (bIdx / mainBundles) * Math.PI * 2;
          const spread = (rng() + rng() - 1.0) * ((Math.PI * 2) / mainBundles) * 0.42;
          cordCenterOffset = Math.abs(spread) / (((Math.PI * 2) / mainBundles) * 0.42);
          const wave = (fbm(Math.cos(baseTh) * 3.8 + u * 2.8, Math.sin(baseTh) * 3.8 - u * 2.8, 3) - 0.5) * 0.084;
          theta = baseTh + spread + wave * Math.sin(u * Math.PI) + torsion;
        } else {
          theta = rng() * Math.PI * 2;
          cordCenterOffset = 0.9;
        }

        const cd = evalCryptsAndDeflect(theta, u);
        if (!isDeepBed) {
          theta = cd.theta;
        }

        const colU = collaretteU(theta);
        const microCrypt = fbm(Math.cos(theta) * 11.5 + u * 9.0, Math.sin(theta) * 11.5 - u * 9.0, 3);
        const inCrypt = cd.crypt > 0.13 || (!isSuperficial && microCrypt < 0.31 && u > 0.08 && u < 0.80);
        const cryptStrength = Math.max(cd.crypt, microCrypt < 0.31 ? (0.31 - microCrypt) * 3.0 : 0);

        if (inCrypt && !isDeepBed) {
          if (rng() < Math.min(0.97, cryptStrength * 1.32)) continue;
        }

        const distCol = u - colU;
        const colCrown = Math.exp(-Math.pow(distCol / 0.042, 2));
        const colHalo = Math.exp(-Math.pow(distCol / 0.115, 2));
        const isInner = u < colU;
        const limbus = smoothstep(0.76, 0.988, u);

        // Deep dramatic concentric contraction rings
        let furrowDip = 0;
        if (u > 0.48 && u < 0.88) {
          const fPhase = Math.sin((u - 0.50) * 54.0 + fbm(Math.cos(theta) * 3, Math.sin(theta) * 3, 2) * 2.6);
          const arcMask = fbm(Math.cos(theta) * 2.2 - 5.0, Math.sin(theta) * 2.2 + 5.0, 2);
          if (fPhase > 0.60 && arcMask > 0.36) {
            furrowDip = ((fPhase - 0.60) / 0.40) * 0.56;
          }
        }

        const sec1 = fbm(Math.cos(theta) * 1.8 + 3.1, Math.sin(theta) * 1.8 - 2.4, 3);
        const sec2 = fbm(Math.cos(theta) * 4.5 - 7.2, Math.sin(theta) * 4.5 + 6.1, 2);

        let freckleAmt = 0;
        for (let f = 0; f < freckles.length; f++) {
          const fr = freckles[f];
          const dth = wrapAngle(theta - fr.th) / fr.radTh;
          const du = (u - fr.u) / fr.radU;
          const d2 = dth * dth + du * du;
          if (d2 < 1.3) {
            const noisyEdge = 1.0 + (sec2 - 0.5) * 0.55;
            if (d2 < noisyEdge) {
              freckleAmt = Math.max(freckleAmt, 1.0 - d2 / noisyEdge);
            }
          }
        }

        // Stylized monochrome mineral tones: shadowy inner sphincter basin -> blazing star collarette -> sculpted graphite/silver cords
        let baseTone = 0;
        if (freckleAmt > 0.22 && rng() < freckleAmt * 0.92) {
          baseTone = 0.03 + rng() * 0.07;
          layer = 2;
        } else if (isDeepBed || inCrypt) {
          baseTone = 0.02 + rng() * 0.07;
          layer = 0;
        } else if (colCrown > 0.32 && rng() < colCrown * 0.95) {
          // Blazing star-shaped collarette crest: crushed white quartz & bright silver
          const w = rng();
          if (w < 0.55) {
            baseTone = 0.88 + rng() * 0.12;
            glint = 0.55 + rng() * 0.45;
          } else if (w < 0.86) {
            baseTone = 0.62 + rng() * 0.24;
          } else {
            baseTone = 0.18 + rng() * 0.18;
          }
          layer = 3;
        } else if (isInner) {
          // Shadowy, tense radial sphincter spokes recessed inside the collarette crater
          const pupilShadow = smoothstep(0.0, 0.18, u);
          baseTone = (0.18 + rng() * 0.34 + colHalo * 0.24) * (0.42 + 0.58 * pupilShadow);
          layer = 1;
        } else if (isSuperficial) {
          // Sweeping bright silver-silica ribbons arching across dark chasms
          baseTone = 0.72 + rng() * 0.26;
          layer = 3;
          if (rng() < 0.28) glint = 0.45 + rng() * 0.55;
        } else {
          // Sculpted mid/outer radial cords
          const m = rng();
          if (m < 0.36) {
            baseTone = 0.46 + sec1 * 0.24 + sec2 * 0.08;
          } else if (m < 0.72) {
            baseTone = 0.20 + sec1 * 0.16;
          } else if (m < 0.90) {
            baseTone = 0.68 + sec1 * 0.20;
          } else {
            baseTone = 0.08 + rng() * 0.10;
          }
          layer = cd.rimRidge > 0.20 ? 2 : 1;
        }

        const cordCrest = 1.18 - cordCenterOffset * 0.44;

        // Bold Theatrical Chiaroscuro: blazing upper-left spotlight sweeping into deep noir lower-right shadow
        const radialDirX = Math.cos(theta), radialDirY = Math.sin(theta);
        const macroDot = radialDirX * lx + radialDirY * ly;

        const slopeSign = distCol >= 0 ? 1.0 : -1.0;
        const slopeMag = Math.exp(-Math.pow(distCol / 0.11, 2)) * 0.72 + (distCol > 0 ? limbus * 0.38 : 0.28);
        const normalDotLight = slopeSign * macroDot * slopeMag;

        // Strong asymmetric spotlight across the eye + razor silver rim-light on shadowed outer crescent
        const keyLight = 0.24 + 1.08 * Math.pow(smoothstep(-0.85, 0.92, macroDot), 1.15);
        const eclipseRim = smoothstep(0.76, 0.95, u) * Math.pow(Math.max(0, -macroDot), 1.6) * 0.42;

        const topoLight = Math.max(0.10, keyLight + normalDotLight * 0.58 + cd.rimRidge * 0.28 + eclipseRim - furrowDip);
        const limbalDarken = 1.0 - limbus * 0.86;
        const grainJitter = 0.78 + rng() * 0.42;

        let rawLum = baseTone * cordCrest * topoLight * limbalDarken * grainJitter;
        if (inCrypt) rawLum *= 0.24 + (1 - cryptStrength) * 0.20;

        lum = Math.max(2, Math.min(255, contrastCurve(rawLum) * 255));

        const sizeRoll = rng();
        if (layer === 3 && sizeRoll < 0.30) {
          sizeType = 2;
        } else if (layer === 0) {
          sizeType = sizeRoll < 0.20 ? 1 : 0;
        } else {
          sizeType = sizeRoll < 0.09 ? 2 : (sizeRoll < 0.58 ? 1 : 0);
        }

        if (glint === 0 && rng() < 0.08 && lum > 120) {
          glint = 0.4 + rng() * 0.6;
        }
      }

      temp.push({
        u,
        theta,
        lum: lum | 0,
        sizeType,
        layer,
        glint
      });
    }

    temp.sort((a, b) => a.layer - b.layer);

    count = temp.length;
    pU = new Float32Array(count);
    pCos = new Float32Array(count);
    pSin = new Float32Array(count);
    pWobble = new Float32Array(count);
    pX = new Float32Array(count);
    pY = new Float32Array(count);
    pVX = new Float32Array(count);
    pVY = new Float32Array(count);
    pLum = new Uint8Array(count);
    pSize = new Uint8Array(count);
    pLayer = new Uint8Array(count);
    pGlint = new Float32Array(count);

    const cx = pw * 0.5;
    const cy = ph * 0.5;

    for (let i = 0; i < count; i++) {
      const item = temp[i];
      const th = item.theta;
      const cosT = Math.cos(th);
      const sinT = Math.sin(th);
      const wob = (fbm(cosT * 3.4 + 2.1, sinT * 3.4 - 1.7, 3) - 0.5) * 0.018
                + Math.sin(th * 72.0) * 0.0032 * Math.max(0, 1.0 - item.u * 7.5);

      pU[i] = item.u;
      pCos[i] = cosT;
      pSin[i] = sinT;
      pWobble[i] = wob;
      pLum[i] = item.lum;
      pSize[i] = item.sizeType;
      pLayer[i] = item.layer;
      pGlint[i] = item.glint;

      const pf = pupilFrac + wob;
      const rFrac = item.u <= 1.0
        ? (pf + item.u * (1.0 - pf))
        : (1.0 + (item.u - 1.0) * 0.765);
      const rad = rFrac * outerR;
      pX[i] = cx + cosT * rad;
      pY[i] = cy + sinT * rad;
    }
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    width = window.innerWidth;
    height = window.innerHeight;
    pw = Math.max(10, Math.floor(width * dpr));
    ph = Math.max(10, Math.floor(height * dpr));
    canvas.width = pw;
    canvas.height = ph;

    imgData = ctx.createImageData(pw, ph);
    frameBuf = new Uint8Array(imgData.data.buffer);

    buildStaticSandBed();
    buildParticles();
  }

  let resizeTimer = 0;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(resize, 80);
  });

  window.addEventListener('pointermove', (e) => {
    const nx = e.clientX * dpr;
    const ny = e.clientY * dpr;
    if (mouse.active) {
      mouse.vx = nx - mouse.x;
      mouse.vy = ny - mouse.y;
    }
    mouse.x = nx;
    mouse.y = ny;
    mouse.active = true;
  });

  window.addEventListener('pointerleave', () => {
    mouse.active = false;
  });

  resize();

  let startTime = performance.now();

  function frame(now) {
    const t = (now - startTime) * 0.001;

    // Copy pre-rendered volcanic/obsidian sand bed
    frameBuf.set(bedBuf);

    const cx = pw * 0.5;
    const cy = ph * 0.5;
    const minDim = Math.min(pw, ph);
    const outerR = minDim * 0.405;

    // Dramatic slow pupil contraction/dilation pulse
    const pupilPulse = Math.sin(t * 0.68) * 0.014 + Math.sin(t * 1.75 + 0.8) * 0.005;
    const curPupilFrac = 0.24 + pupilPulse;

    const mActive = mouse.active;
    const mx = mouse.x, my = mouse.y;
    const mvx = mouse.vx * 0.18, mvy = mouse.vy * 0.18;
    mouse.vx *= 0.85;
    mouse.vy *= 0.85;
    const brushR = outerR * 0.16;
    const brushR2 = brushR * brushR;

    const tGlint = t * 0.26;

    for (let i = 0; i < count; i++) {
      const u = pU[i];
      const pf = curPupilFrac + pWobble[i];

      const rFrac = u <= 1.0
        ? (pf + u * (1.0 - pf))
        : (1.0 + (u - 1.0) * 0.765);
      const targetR = rFrac * outerR;
      const tx = cx + pCos[i] * targetR;
      const ty = cy + pSin[i] * targetR;

      let x = pX[i];
      let y = pY[i];
      let vx = pVX[i] + (tx - x) * 0.11;
      let vy = pVY[i] + (ty - y) * 0.11;

      let disturb = 0;
      if (mActive) {
        const dx = x - mx;
        const dy = y - my;
        const d2 = dx * dx + dy * dy;
        if (d2 < brushR2 && d2 > 0.01) {
          const d = Math.sqrt(d2);
          const fall = 1.0 - d / brushR;
          const push = fall * fall * 1.75 * dpr;
          vx += (dx / d) * push + mvx * fall;
          vy += (dy / d) * push + mvy * fall;
          disturb = fall;
        }
      }

      vx *= 0.76;
      vy *= 0.76;
      x += vx;
      y += vy;

      pX[i] = x;
      pY[i] = y;
      pVX[i] = vx;
      pVY[i] = vy;

      let lum = pLum[i];

      // Crystalline white-quartz & silver-mica facets glint starkly under the grazing light
      const gl = pGlint[i];
      if (gl > 0) {
        const phase = tGlint + gl * 5.0 + (vx + vy) * 0.35;
        const tri = 1.0 - Math.abs(((phase - Math.floor(phase)) * 2.0) - 1.0) * 2.0;
        if (tri > 0.50 || disturb > 0.12) {
          const boost = (tri > 0.50 ? (tri - 0.50) * 62 * gl : 0) + disturb * 42;
          lum = Math.min(255, (lum + boost) | 0);
        }
      }

      splatGrain(frameBuf, pw, ph, x, y, lum, pSize[i], pLayer[i] > 0);
    }

    ctx.putImageData(imgData, 0, 0);
    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
