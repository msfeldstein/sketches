<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lava Clouds: King's Hammer</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: #12061f;
        color: #fff6dd;
        font-family: "Trebuchet MS", Arial, sans-serif;
        overflow: hidden;
      }

      body {
        display: grid;
        place-items: center;
      }

      canvas {
        width: min(100vw, 1280px);
        height: min(100vh, 720px);
        display: block;
        background: #10051c;
        box-shadow: 0 20px 80px rgba(0, 0, 0, 0.55);
      }
    </style>
  </head>
  <body>
    <canvas id="game" width="1280" height="720" aria-label="Lava Clouds game"></canvas>
    <script src="game.js"></script>
  </body>
</html>
